<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捕魚機素材管理器 v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
:root{--bg:#080b12;--panel:#0e1320;--card:#131929;--border:#1c2540;--accent:#00e5ff;--accent2:#7c4dff;--gold:#ffd740;--green:#00e676;--red:#ff4444;--orange:#ff9800;--text:#c8d6f0;--dim:#4a5570;--white:#e8eeff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025) 1px,transparent 1px);background-size:48px 48px;}
.app{position:relative;z-index:1;display:grid;grid-template-columns:270px 1fr;min-height:100vh;}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
.logo{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:3px;color:var(--accent);}
.logo-sub{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px;}
.fish-list{flex:1;overflow-y:auto;padding:8px;}
.fish-list::-webkit-scrollbar{width:3px;}
.fish-list::-webkit-scrollbar-thumb{background:var(--border);}
.section-label{font-size:10px;letter-spacing:2px;color:var(--dim);padding:10px 8px 4px;font-weight:600;text-transform:uppercase;}
.fish-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all 0.15s;}
.fish-item:hover{background:rgba(0,229,255,0.05);border-color:rgba(0,229,255,0.1);}
.fish-item.active{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.3);}
.fish-id{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--dim);min-width:20px;text-align:center;}
.fish-item.active .fish-id{color:var(--accent);}
.fish-name-label{flex:1;font-size:13px;font-weight:600;color:var(--white);}
.fish-badge{font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 5px;border-radius:3px;text-transform:uppercase;flex-shrink:0;}
.badge-sprite{background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.3);}
.badge-geo{background:rgba(255,152,0,0.12);color:var(--orange);border:1px solid rgba(255,152,0,0.25);}
.badge-boss{background:rgba(255,68,68,0.12);color:var(--red);border:1px solid rgba(255,68,68,0.25);}
.del-btn{width:16px;height:16px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;line-height:1;}
.del-btn:hover{border-color:var(--red);color:var(--red);background:rgba(255,68,68,0.08);}
.sidebar-actions{padding:10px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.btn-add{padding:8px;border-radius:6px;background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.2);color:var(--accent);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;text-align:center;transition:all 0.15s;}
.btn-add:hover{background:rgba(0,229,255,0.12);}
.btn-load-html{padding:8px;border-radius:6px;background:rgba(124,77,255,0.08);border:1px solid rgba(124,77,255,0.25);color:var(--accent2);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;text-align:center;position:relative;transition:all 0.15s;}
.btn-load-html:hover{background:rgba(124,77,255,0.15);}
.btn-load-html input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.btn-export{padding:10px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#000;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:opacity 0.15s;}
.btn-export:hover{opacity:0.85;}
.html-loaded{font-size:10px;color:var(--green);text-align:center;padding:2px 0;letter-spacing:1px;}
.main{display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(14,19,32,0.8);}
.topbar-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--white);letter-spacing:2px;}
.topbar-sub{font-size:11px;color:var(--dim);margin-left:auto;}
.content{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.content::-webkit-scrollbar{width:3px;}
.content::-webkit-scrollbar-thumb{background:var(--border);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.card-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
.card-body{padding:14px;}
.dropzone{border:1px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:rgba(0,229,255,0.04);}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dropzone-icon{font-size:24px;margin-bottom:6px;opacity:0.4;}
.dropzone-text{font-size:12px;color:var(--dim);}
.dropzone-text span{color:var(--accent);}
.dropzone-formats{font-size:10px;color:var(--dim);margin-top:3px;}
.preview-wrap{background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:110px;overflow:hidden;}
.preview-placeholder{font-size:11px;color:var(--dim);}
.preview-controls{display:flex;align-items:center;gap:8px;margin-top:6px;}
.fps-label{font-size:10px;color:var(--dim);}
.fps-val{font-size:12px;color:var(--accent);font-weight:600;min-width:26px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-label{font-size:10px;letter-spacing:1.5px;color:var(--dim);font-weight:600;text-transform:uppercase;}
.form-input{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--white);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;transition:border-color 0.15s;outline:none;}
.form-input:focus{border-color:var(--accent);}
.form-select{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--white);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;outline:none;cursor:pointer;}
.auto-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.auto-chip{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(0,229,255,0.08);color:var(--accent);border:1px solid rgba(0,229,255,0.2);font-weight:600;}
.auto-chip.warn{background:rgba(255,152,0,0.08);color:var(--orange);border-color:rgba(255,152,0,0.2);}
.auto-chip.ok{background:rgba(0,230,118,0.08);color:var(--green);border-color:rgba(0,230,118,0.2);}
.code-block{background:#06090f;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'Courier New',monospace;font-size:11px;line-height:1.7;overflow-x:auto;white-space:pre;color:#c8d6f0;position:relative;}
.code-kw{color:#7c4dff;}.code-str{color:#00e676;}.code-num{color:#ffd740;}.code-cmt{color:#4a5570;}
.copy-btn{position:absolute;top:8px;right:8px;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.2);border-radius:4px;padding:3px 8px;color:var(--accent);font-size:10px;cursor:pointer;letter-spacing:1px;font-weight:600;font-family:'Rajdhani',sans-serif;}
.copy-btn:hover{background:rgba(0,229,255,0.2);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:300px;}
.modal h3{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:16px;}
.modal-row{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.btn-primary{flex:1;padding:9px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#000;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;}
.btn-cancel{padding:9px 14px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Rajdhani',sans-serif;font-size:12px;cursor:pointer;}
.btn-cancel:hover{border-color:var(--text);color:var(--text);}
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--white);font-weight:600;transform:translateY(80px);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:rgba(0,230,118,0.4);color:var(--green);}
.toast.error{border-color:rgba(255,68,68,0.4);color:var(--red);}
.statusbar{padding:7px 22px;border-top:1px solid var(--border);display:flex;gap:16px;align-items:center;background:var(--panel);font-size:10px;color:var(--dim);letter-spacing:1px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;box-shadow:0 0 5px var(--green);}
input[type=range]{accent-color:var(--accent);cursor:pointer;}
.no-sprite-msg{font-size:11px;color:var(--orange);padding:6px 9px;background:rgba(255,152,0,0.06);border-radius:6px;border:1px solid rgba(255,152,0,0.15);margin-top:6px;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">FISHING GAME</div>
      <div class="logo-sub">素材管理器 v2.0</div>
    </div>
    <div class="fish-list" id="fishList"></div>
    <div class="sidebar-actions">
      <div class="btn-add" onclick="openAddModal()">＋ 新增魚種</div>
      
      <div class="btn-add" style="background:rgba(0,230,118,0.08);border-color:rgba(0,230,118,0.25);color:var(--green);" onclick="exportProject()">💾 儲存設定專案 (.json)</div>
      <div class="btn-load-html" style="background:rgba(255,152,0,0.08);border-color:rgba(255,152,0,0.25);color:var(--orange);">
        <input type="file" accept=".json" onchange="importProject(event)">
        📂 載入設定專案 (.json)
      </div>
      <div class="btn-load-html">
        <input type="file" accept=".html" onchange="loadGameHtml(event)">
        📂 載入 fishing_game.html
      </div>
      <div class="html-loaded" id="htmlLoadedLabel" style="display:none"></div>
      <button class="btn-export" onclick="exportGame()">匯出 FISHING_GAME.HTML</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">選擇魚種</div>
      <div class="topbar-sub" id="topbarSub">點擊左側魚種開始編輯</div>
    </div>
    <div class="content" id="mainContent">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;opacity:0.25;padding-top:60px;">
        <div style="font-size:44px;">🐟</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;color:var(--dim);">SELECT A FISH TO EDIT</div>
        <div style="font-size:11px;color:var(--dim);margin-top:8px;text-align:center;line-height:2;">雙擊名稱可改名 ／ 點 ✕ 可刪除</div>
      </div>
    </div>
    <div class="statusbar">
      <span><span class="dot"></span>就緒</span>
      <span>Sprite <strong id="spriteCount">0</strong> · 幾何 <strong id="geoCount">0</strong></span>
      <span id="htmlStatus">未載入遊戲 HTML</span>
    </div>
  </main>
</div>

<div class="modal-bg" id="addModal" style="display:none" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <h3>新增魚種</h3>
    <div class="modal-row">
      <label class="form-label">魚種 ID（數字 1~99）</label>
      <input class="form-input" type="number" id="newFishId" placeholder="例：10" min="1" max="99">
    </div>
    <div class="modal-row">
      <label class="form-label">魚種名稱</label>
      <input class="form-input" type="text" id="newFishName" placeholder="例：水母">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">取消</button>
      <button class="btn-primary" onclick="confirmAdd()">新增</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="renameModal" style="display:none" onclick="if(event.target===this)closeRenameModal()">
  <div class="modal">
    <h3>修改魚種名稱</h3>
    <div class="modal-row">
      <label class="form-label">新名稱</label>
      <input class="form-input" type="text" id="renameInput">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeRenameModal()">取消</button>
      <button class="btn-primary" onclick="confirmRename()">確認</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="changeIdModal" style="display:none" onclick="if(event.target===this)closeChangeIdModal()">
  <div class="modal">
    <h3>修改魚種 ID (層級)</h3>
    <div class="modal-row">
      <label class="form-label">新 ID (數字越大越在上層)</label>
      <input class="form-input" type="number" id="newIdInput" min="1" max="99">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeChangeIdModal()">取消</button>
      <button class="btn-primary" onclick="confirmChangeId()">確認</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const fishNames={1:'小丑魚',2:'小魚',3:'花魚',4:'河豚',5:'螃蟹',6:'章魚',7:'鯊魚',8:'龍王',9:'海龜'};
const config={
  boss:{sheet:'大鯊魚.webp',frames:192,cols:16,displayW:800,displayH:449,bgMode:'none',hp:750,mult:500,size:200},
  fish:{
    1:{sheet:'小丑魚.webp',frames:145,cols:15,displayW:107,displayH:62,bgMode:'none'},
    2:{sheet:null},3:{sheet:null},4:{sheet:null},5:{sheet:null},6:{sheet:null},
    7:{sheet:'Shark-King.webp',frames:18,cols:18,displayW:200,displayH:112,bgMode:'none'},
    8:{sheet:null},
    9:{sheet:'海龜.webp',frames:192,cols:16,displayW:200,displayH:136,bgMode:'none'},
  }
};
let activeId=null,previewAnim=null,previewFps=15;
let previewUrls={},gameHtmlSrc='',renameTarget=null;
// ★ 新增：控制是否顯示碰撞範圍
window.showHitboxEnabled = false; 
function toggleHitbox(isChecked) { window.showHitboxEnabled = isChecked; }

function buildSidebar(){
  const list=document.getElementById('fishList');
  list.innerHTML='';
  list.appendChild(makeItem('boss','★','大鯊魚 BOSS','boss',config.boss.sheet));
  const lbl=document.createElement('div');
  lbl.className='section-label';lbl.textContent='魚種（雙擊名稱改名）';
  list.appendChild(lbl);
  Object.keys(config.fish).sort((a,b)=>+a-+b).forEach(id=>{
    const cfg=config.fish[id];
    list.appendChild(makeItem(id,id,fishNames[id]||'魚種'+id,null,cfg.sheet));
  });
  updateStatusBar();
}

function makeItem(id,label,name,forceBadge,sheet){
  const el=document.createElement('div');
  el.className='fish-item';el.dataset.id=id;
  let badge,cls;
  if(forceBadge==='boss'){badge='BOSS';cls='badge-boss';}
  else if(sheet){badge='SPRITE';cls='badge-sprite';}
  else{badge='幾何';cls='badge-geo';}
  el.innerHTML=`
    <span class="fish-id">${label}</span>
    <span class="fish-name-label">${name}</span>
    <span class="fish-badge ${cls}">${badge}</span>
    ${id!=='boss'?'<button class="del-btn" title="刪除">✕</button>':''}
  `;
  const nameEl=el.querySelector('.fish-name-label');
  const idEl=el.querySelector('.fish-id');
  nameEl.style.cursor='pointer';
  nameEl.addEventListener('click',()=>selectItem(id));
  if(id!=='boss'){
    idEl.style.cursor='pointer';
    idEl.title='雙擊修改 ID (調整層級)';
    idEl.addEventListener('dblclick',e=>{e.stopPropagation();openChangeIdModal(id);});
    nameEl.addEventListener('dblclick',e=>{e.stopPropagation();openRenameModal(id);});
    el.querySelector('.del-btn').addEventListener('click',e=>{e.stopPropagation();deleteFish(id);});
  }
  el.addEventListener('click',e=>{
    if(!e.target.classList.contains('del-btn')&&!e.target.classList.contains('fish-name-label'))selectItem(id);
  });
  return el;
}

function updateStatusBar(){
  let s=0,g=0;
  Object.values(config.fish).forEach(c=>c.sheet?s++:g++);
  if(config.boss.sheet)s++;
  document.getElementById('spriteCount').textContent=s;
  document.getElementById('geoCount').textContent=g;
  document.getElementById('htmlStatus').textContent=
    gameHtmlSrc?'✓ 已載入遊戲 HTML，匯出將產生完整 .html':'未載入遊戲 HTML（僅匯出設定 txt）';
}

function openAddModal(){
  document.getElementById('newFishId').value='';
  document.getElementById('newFishName').value='';
  document.getElementById('addModal').style.display='flex';
  setTimeout(()=>document.getElementById('newFishId').focus(),50);
}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
function confirmAdd(){
  const id=parseInt(document.getElementById('newFishId').value);
  const name=document.getElementById('newFishName').value.trim();
  if(!id||id<1||id>99){showToast('請輸入有效 ID（1~99）',false);return;}
  if(!name){showToast('請輸入名稱',false);return;}
  if(config.fish[id]){showToast(`ID ${id} 已存在`,false);return;}
  config.fish[id]={sheet:null};fishNames[id]=name;
  closeAddModal();buildSidebar();selectItem(id);
  showToast(`✓ 已新增「${name}」(ID:${id})`,true);
}

function deleteFish(id){
  const name=fishNames[id]||`魚種${id}`;
  if(!confirm(`確定要刪除「${name}」嗎？`))return;
  delete config.fish[id];
  if(activeId==id){activeId=null;clearEditor();}
  buildSidebar();showToast(`已刪除 ${name}`,true);
}

function openRenameModal(id){
  renameTarget=id;
  document.getElementById('renameInput').value=fishNames[id]||'';
  document.getElementById('renameModal').style.display='flex';
  setTimeout(()=>{const i=document.getElementById('renameInput');i.focus();i.select();},50);
}
function closeRenameModal(){document.getElementById('renameModal').style.display='none';renameTarget=null;}
function confirmRename(){
  const name=document.getElementById('renameInput').value.trim();
  if(!name){showToast('請輸入名稱',false);return;}
  fishNames[renameTarget]=name;
  closeRenameModal();buildSidebar();
  if(activeId==renameTarget)document.getElementById('topbarTitle').textContent=`${renameTarget} ${name}`;
  showToast(`✓ 已改名為「${name}」`,true);
}

// === 修改 ID (層級) 邏輯 ===
let changeIdTarget = null;
function openChangeIdModal(id) {
  changeIdTarget = id;
  document.getElementById('newIdInput').value = id;
  document.getElementById('changeIdModal').style.display = 'flex';
  setTimeout(() => { const i = document.getElementById('newIdInput'); i.focus(); i.select(); }, 50);
}
function closeChangeIdModal() { document.getElementById('changeIdModal').style.display = 'none'; changeIdTarget = null; }
function confirmChangeId() {
  const newId = parseInt(document.getElementById('newIdInput').value);
  if (!newId || newId < 1 || newId > 99) { showToast('請輸入有效 ID（1~99）', false); return; }
  if (newId == changeIdTarget) { closeChangeIdModal(); return; } // 沒改數字
  if (config.fish[newId]) { showToast(`⚠ ID ${newId} 已被佔用！請先改掉或刪除該魚種。`, false); return; }

  // 1. 搬移設定與名稱資料
  config.fish[newId] = config.fish[changeIdTarget];
  fishNames[newId] = fishNames[changeIdTarget];
  delete config.fish[changeIdTarget];
  delete fishNames[changeIdTarget];

  // 2. 如果正在編輯這隻魚，要同步更新畫面的狀態
  if (activeId == changeIdTarget) {
    activeId = newId;
    if (previewUrls[changeIdTarget]) {
      previewUrls[newId] = previewUrls[changeIdTarget];
      delete previewUrls[changeIdTarget];
    }
  }

  // 3. 關閉視窗、重整列表
  closeChangeIdModal(); 
  buildSidebar();
  if (activeId == newId) selectItem(newId);
  showToast(`✓ ID 已成功更改為 ${newId}`, true);
}

function handleFile(e){const f=e.target.files[0];if(f)processFile(f);}
function processFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['webp','png'].includes(ext)){showToast('只支援 .webp 或 .png',false);return;}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    const isBoss=activeId==='boss';
    const cfg=isBoss?config.boss:config.fish[activeId];
    cfg.sheet=file.name;previewUrls[activeId]=url;
    autoDetect(img,cfg);
    document.querySelector('#dropzone .dropzone-text').innerHTML=`拖曳或點擊上傳<br><span>${file.name}</span>`;
    const pc=document.getElementById('spriteParamsCard');
    if(pc){pc.style.opacity='1';pc.style.pointerEvents='auto';}
    buildSidebar();
    document.querySelectorAll('.fish-item').forEach(el=>{if(el.dataset.id==activeId)el.classList.add('active');});
    document.getElementById('topbarSub').textContent=`Sprite：${file.name}`;
    loadPreview(url,cfg);updateCodePreview();
    showToast(`✓ 已載入 ${file.name}`,true);
  };
  img.src=url;
}

function autoDetect(img,cfg){
  const info=document.getElementById('autoInfo');if(!info)return;
  const w=img.naturalWidth,h=img.naturalHeight;
  const c=cfg.cols||1,f=cfg.frames||1,rows=Math.ceil(f/c);
  const fw=(w/c).toFixed(1),fh=(h/rows).toFixed(1);
  const wOk=w%c===0,hOk=h%rows===0;
  info.innerHTML=`
    <span class="auto-chip">圖片 ${w}×${h}</span>
    <span class="auto-chip ${wOk?'ok':'warn'}">frameW=${fw}${wOk?'':' ⚠'}</span>
    <span class="auto-chip ${hOk?'ok':'warn'}">frameH=${fh}${hOk?'':' ⚠'}</span>
    <span class="auto-chip">rows=${rows}</span>
  `;
}

function loadPreview(url,cfg){
  stopPreview();
  const wrap=document.getElementById('previewWrap'),ctrl=document.getElementById('previewControls');
  if(!wrap||!cfg.frames||!cfg.cols)return;
  const img=new Image();
  img.onload=()=>{
    const c=cfg.cols,f=cfg.frames,rows=Math.ceil(f/c);
    const fw=img.naturalWidth/c,fh=img.naturalHeight/rows;
    const scale=Math.min(320/fw,150/fh,2);
    const dw=Math.round(fw*scale),dh=Math.round(fh*scale);
    const cvs=document.createElement('canvas');cvs.width=dw;cvs.height=dh;
    wrap.innerHTML='';wrap.appendChild(cvs);
    if(ctrl)ctrl.style.display='flex';
    const ctx2=cvs.getContext('2d');let frame=0,last=0;
    
    // ★ 正確位置：draw 必須包在 loadPreview 裡面
    function draw(ts){
      if(ts-last>=1000/previewFps){
        last=ts;
        ctx2.clearRect(0,0,dw,dh);
        ctx2.drawImage(img,(frame%c)*fw,Math.floor(frame/c)*fh,fw,fh,0,0,dw,dh);
        
        // ════════ ★ 新增：繪製碰撞範圍 ★ ════════
        if (window.showHitboxEnabled) {
          ctx2.save();
          ctx2.translate(dw/2, dh/2); // 將原點移到畫布正中心
          ctx2.fillStyle = 'rgba(255, 68, 68, 0.4)';   // 半透明紅色填滿
          ctx2.strokeStyle = 'rgba(255, 68, 68, 0.9)'; // 紅色外框線
          ctx2.lineWidth = 2;
          ctx2.beginPath();
          
          if (activeId === 'boss') {
            const hitW = (cfg.size * 1.8 / (cfg.displayW || fw)) * dw;
            const hitH = (cfg.size * 1.0 / (cfg.displayH || fh)) * dh;
            ctx2.ellipse(0, 0, hitW, hitH, 0, 0, Math.PI*2);
          } else if (cfg.hitType === 'rect') {
            // ★ 畫出自訂長方形
            const rw = ((cfg.hitW || fw) / (cfg.displayW || fw)) * dw;
            const rh = ((cfg.hitH || fh) / (cfg.displayH || fh)) * dh;
            ctx2.rect(-rw/2, -rh/2, rw, rh);
          } else {
            const hitR = (cfg.size ? cfg.size * 0.8 : fw*0.4) / (cfg.displayW || fw) * dw;
            ctx2.arc(0, 0, hitR, 0, Math.PI*2);
          }
          
          ctx2.fill();   // 填滿紅色
          ctx2.stroke(); // 畫出外框線
          ctx2.restore();
        }
        // ═══════════════════════════════════════
        
        frame=(frame+1)%f;
      }
      previewAnim=requestAnimationFrame(draw);
    }
    previewAnim=requestAnimationFrame(draw);
  };img.src=url;
}
function stopPreview(){if(previewAnim){cancelAnimationFrame(previewAnim);previewAnim=null;}}
function updateFps(v){previewFps=+v;document.getElementById('fpsVal').textContent=v;}

function updateCfg(key,val){
  const cfg=activeId==='boss'?config.boss:config.fish[activeId];
  cfg[key]=val;
  if((key==='cols'||key==='frames')&&previewUrls[activeId]){const img=new Image();img.onload=()=>autoDetect(img,cfg);img.src=previewUrls[activeId];}
  updateCodePreview();
}

function updateCodePreview(){
  const el=document.getElementById('codeText');if(!el)return;
  const isBoss=activeId==='boss';
  const cfg=isBoss?config.boss:config.fish[activeId];
  el.innerHTML=isBoss?genBossCode(cfg):genFishCode(activeId,cfg);
}
function genFishCode(id,cfg){
  const name=fishNames[id]||`魚種${id}`;
  let ex = '';
  if(cfg.hp) ex += `, hp: <span class="code-num">${cfg.hp}</span>`;
  if(cfg.mult) ex += `, mult: <span class="code-num">${cfg.mult}</span>`;
  if(cfg.size) ex += `, size: <span class="code-num">${cfg.size}</span>`;
  if(cfg.spawnDir) ex += `, spawnDir: <span class="code-str">'${cfg.spawnDir}'</span>`;
  if(cfg.speed) ex += `, speed: <span class="code-num">${cfg.speed}</span>`;
  if(cfg.freq) ex += `, freq: <span class="code-num">${cfg.freq}</span>`;

  if(!cfg.sheet) return `    <span class="code-num">${id}</span><span class="code-kw">:</span> { sheet: null${ex} },  <span class="code-cmt">// ${name}（幾何繪製）</span>`;

  return[
    `    <span class="code-num">${id}</span><span class="code-kw">:</span> {`,
    `      sheet<span class="code-kw">:</span> <span class="code-str">'${cfg.sheet}'</span>,`,
    `      frames<span class="code-kw">:</span> <span class="code-num">${cfg.frames||'?'}</span>,  cols<span class="code-kw">:</span> <span class="code-num">${cfg.cols||'?'}</span>,`,
    `      displayW<span class="code-kw">:</span> <span class="code-num">${cfg.displayW||'?'}</span>,  displayH<span class="code-kw">:</span> <span class="code-num">${cfg.displayH||'?'}</span>,`,
    `      bgMode<span class="code-kw">:</span> <span class="code-str">'${cfg.bgMode||'none'}'</span>${ex}`,
    `    },  <span class="code-cmt">// ${name}</span>`,
  ].join('\n');
}
function genBossCode(cfg){
  return[
    `boss<span class="code-kw">:</span> {`,
    `  sheet<span class="code-kw">:</span>  <span class="code-str">'${cfg.sheet}'</span>,`,
    `  frames<span class="code-kw">:</span> <span class="code-num">${cfg.frames}</span>,  cols<span class="code-kw">:</span> <span class="code-num">${cfg.cols}</span>,`,
    `  displayW<span class="code-kw">:</span> <span class="code-num">${cfg.displayW}</span>,  displayH<span class="code-kw">:</span> <span class="code-num">${cfg.displayH}</span>,`,
    `  bgMode<span class="code-kw">:</span> <span class="code-str">'${cfg.bgMode||'none'}'</span>,`,
    `  hp<span class="code-kw">:</span> <span class="code-num">${cfg.hp}</span>,  mult<span class="code-kw">:</span> <span class="code-num">${cfg.mult}</span>,  size<span class="code-kw">:</span> <span class="code-num">${cfg.size}</span>,`,
    `},`,
  ].join('\n');
}
function copyCode(){
  const el=document.getElementById('codeText');if(!el)return;
  navigator.clipboard.writeText(el.innerText).then(()=>showToast('✓ 已複製',true));
}

function loadGameHtml(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    gameHtmlSrc=ev.target.result;
    document.getElementById('htmlLoadedLabel').style.display='block';
    document.getElementById('htmlLoadedLabel').textContent=`✓ ${file.name}`;
    updateStatusBar();showToast(`✓ 已載入 ${file.name}`,true);
  };
  reader.readAsText(file);
}

  const name=fishNames[id]||`魚種${id}`;
  let ex = '';

  if(cfg.hitH) ex += `, hitH: <span class="code-num">${cfg.hitH}</span>`;

  if(cfg.pathType) ex += `, pathType: '${cfg.pathType}'`;

  if(cfg.sineFreq) ex += `, sineFreq: ${cfg.sineFreq}`;

  if(cfg.formationCount) ex += `, formationCount: ${cfg.formationCount}`;
  if(cfg.pathType === 'arc') {
    if(cfg.turnRateMin) ex += `, turnRateMin: ${cfg.turnRateMin}`;
    if(cfg.turnRateMax) ex += `, turnRateMax: ${cfg.turnRateMax}`;
  }

  if(!cfg.sheet) return `    <span class="code-num">${id}</span><span class="code-kw">:</span> { sheet: null${ex} },  <span class="code-cmt">// ${name}（幾何繪製）</span>`;

  return[
    `    <span class="code-num">${id}</span><span class="code-kw">:</span> {`,
    `      sheet<span class="code-kw">:</span> <span class="code-str">'${cfg.sheet}'</span>,`,
    `      frames<span class="code-kw">:</span> <span class="code-num">${cfg.frames||'?'}</span>,  cols<span class="code-kw">:</span> <span class="code-num">${cfg.cols||'?'}</span>,`,
    `      displayW<span class="code-kw">:</span> <span class="code-num">${cfg.displayW||'?'}</span>,  displayH<span class="code-kw">:</span> <span class="code-num">${cfg.displayH||'?'}</span>,`,
    `      bgMode<span class="code-kw">:</span> <span class="code-str">'${cfg.bgMode||'none'}'</span>${ex}`,
    `    },  <span class="code-cmt">// ${name}</span>`,
  ].join('\n');
}

function buildAssetsBlock(){
  const bc=config.boss;
  
  // ── 1. 組合 ASSETS 字串 ──
  const L=[];
  L.push(`const ASSETS = {`);
  L.push(`  background:      'bg_ocean.jpg',`);
  L.push(`  backgroundVideo: 'bg_ocean.mp4',`);
  L.push(``);
  L.push(`  explosion: {`);
  L.push(`    sheet: 'explosion_sprite.png',`);
  L.push(`    frameW: 250, frameH: 250, frames: 15, fps: 24,`);
  L.push(`  },`);
  L.push(``);
  L.push(`  boss: {`);
  L.push(`    sheet:  '${bc.sheet}',`);
  L.push(`    frames: ${bc.frames}, cols: ${bc.cols},`);
  L.push(`    displayW: ${bc.displayW}, displayH: ${bc.displayH},`);
  L.push(`    bgMode: '${bc.bgMode||'none'}',`);
  L.push(`    hp: ${bc.hp}, mult: ${bc.mult}, size: ${bc.size},`);
  L.push(`  },`);
  L.push(``);
  L.push(`  fishSprites: {`);
  Object.keys(config.fish).sort((a,b)=>+a-+b).forEach(id=>{
    const c=config.fish[id], n=fishNames[id]||`魚種${id}`;
    let ex = '';
    if(c.hitType) ex += `, hitType: '${c.hitType}'`;
    if(c.hitW) ex += `, hitW: ${c.hitW}`;
    if(c.hitH) ex += `, hitH: ${c.hitH}`;
    if(c.pathType) ex += `, pathType: '${c.pathType}'`;
    if(c.sineAmp) ex += `, sineAmp: ${c.sineAmp}`;
    if(c.sineFreq) ex += `, sineFreq: ${c.sineFreq}`;
    if(c.formation) ex += `, formation: '${c.formation}'`;
    if(c.formationCount) ex += `, formationCount: ${c.formationCount}`;
    if(c.spawnDir) ex += `, spawnDir: '${c.spawnDir}'`;

    if(c.pathType === 'arc'){
      if(c.turnRateMin) ex += `, turnRateMin: ${c.turnRateMin}`;
      if(c.turnRateMax) ex += `, turnRateMax: ${c.turnRateMax}`;
    }

    if(c.sheet){
      // ★ 現在 push 出去的時候，ex 裡面就有完整的資料了！
      L.push(`    ${id}: { sheet: '${c.sheet}', frames: ${c.frames}, cols: ${c.cols}, displayW: ${c.displayW}, displayH: ${c.displayH}, bgMode: '${c.bgMode||'none'}'${ex} },  // ${n}`);
    } else {
      L.push(`    ${id}: { sheet: null${ex} },  // ${n}（幾何繪製）`);
    }
  });
  L.push(`  }`);
  L.push(`};`);

  // ── 2. 組合 FISH_TYPES 字串 ──
  const F=[];
  F.push(`const FISH_TYPES = [`);
  const defaultColors = [
    { c: '#ff9977', g: '#ff6644' }, { c: '#88ddff', g: '#44aaff' }, { c: '#ffcc44', g: '#ffaa00' },
    { c: '#bb88ff', g: '#8844ff' }, { c: '#ff5544', g: '#cc2200' }, { c: '#cc44aa', g: '#aa0088' },
    { c: '#44aa66', g: '#228844' }
  ];
  let colorIndex = 0;

  Object.keys(config.fish).sort((a,b)=>+a-+b).forEach(id=>{
    const c=config.fish[id], n=fishNames[id]||`魚種${id}`;
    const hp = c.hp || 1; const mult = c.mult || 2; const size = c.size || 30; const speed = c.speed || 1.5;
    const freq = c.freq !== undefined && c.freq !== null ? c.freq : 0.1;
    const color = defaultColors[colorIndex % defaultColors.length].c;
    const glowColor = defaultColors[colorIndex % defaultColors.length].g;
    colorIndex++;
    
    F.push(`  { id:${id}, name:'${n}', color:'${color}', glowColor:'${glowColor}', size:${size}, speed:${speed}, hp:${hp}, mult:${mult}, freq:${freq} },`);
  });
  F.push(`];`);

  return { assetsCode: L.join('\n'), fishCode: F.join('\n') };
}

function exportGame(){
  const newCode = buildAssetsBlock();
  
  // 如果根本沒載入 HTML，只匯出文字檔
  if(!gameHtmlSrc){
    const combined = newCode.assetsCode + '\n\n' + newCode.fishCode;
    const blob=new Blob([combined],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fishing_assets_config.txt';a.click();
    showToast('未載入 HTML，已匯出設定 txt',false);return;
  }
  
  // ★ 終極強化版正則表達式：無視任何縮排、空白、換行
  const regexAssets = /const\s+ASSETS\s*=\s*\{[\s\S]*?\n\s*\};/;
  const regexFish = /const\s+FISH_TYPES\s*=\s*\[[\s\S]*?\n\s*\];/;
  
  // ★ 修正誤判 Bug：先用 test 檢查是否真的「找不到區塊」
  if (!regexAssets.test(gameHtmlSrc) || !regexFish.test(gameHtmlSrc)) {
    showToast('⚠ 替換失敗！找不到對應代碼，請確認載入的是正確的遊戲 HTML 檔。',false);
    return;
  }
  
  // 執行替換
  let replaced = gameHtmlSrc.replace(regexAssets, newCode.assetsCode);
  replaced = replaced.replace(regexFish, newCode.fishCode);
  
  // 匯出下載
  const blob=new Blob([replaced],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='FISHING_GAME.html'; // 檔名統一
  a.click();
  showToast('✓ 已完美匯出 FISHING_GAME.html',true);
}

function showToast(msg,success=true){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(success?' success':' error');
  setTimeout(()=>t.className='toast',2500);
}
// ════════════════════════════════════════════
//  ★ 專案存檔與自動記憶系統
// ════════════════════════════════════════════

// 1. 匯出專案 (下載 JSON)
function exportProject() {
  const projectData = { config: config, fishNames: fishNames };
  const blob = new Blob([JSON.stringify(projectData, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fishing_project_save.json';
  a.click();
  showToast('✓ 專案設定已儲存下載', true);
}

// 2. 匯入專案 (讀取 JSON)
function importProject(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.config && data.fishNames) {
        // 清空原物件並覆蓋新資料
        Object.keys(config).forEach(k => delete config[k]);
        Object.assign(config, data.config);
        Object.keys(fishNames).forEach(k => delete fishNames[k]);
        Object.assign(fishNames, data.fishNames);
        
        buildSidebar();
        if(activeId) selectItem(activeId);
        showToast('✓ 成功載入專案設定！', true);
      } else {
        showToast('⚠ 檔案格式錯誤', false);
      }
    } catch(err) {
      showToast('⚠ 解析失敗，這可能不是正確的專案檔', false);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // 清空以便重複載入
}

// 3. 瀏覽器自動記憶 (防重整丟失)
function saveLocal() {
  localStorage.setItem('fishing_config_save', JSON.stringify({config, fishNames}));
}
function loadLocal() {
  const saved = localStorage.getItem('fishing_config_save');
  if(saved) {
    try {
      const data = JSON.parse(saved);
      Object.keys(config).forEach(k => delete config[k]);
      Object.assign(config, data.config);
      Object.keys(fishNames).forEach(k => delete fishNames[k]);
      Object.assign(fishNames, data.fishNames);
    } catch(e){}
  }
}

// 綁定：每次關閉或重整網頁前，自動備份到瀏覽器
window.addEventListener('beforeunload', saveLocal);

// 啟動時：優先讀取瀏覽器記憶
loadLocal();

buildSidebar();
</script>
