<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>金鯊捕魚</title>
<style>

  /* ── 📱 老虎機 Option 系統專屬樣式 ── */
  .phone-button { position: absolute; left: 20px; top: 20px; width: 65px; cursor: pointer; z-index: 950; transition: transform 0.1s; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6)); } 
  .phone-button:active { transform: scale(0.9); }

  /* 底部滑動選單 (適配橫屏：鎖定 400px 寬度並置中，維持老虎機按鈕的完美比例) */
  #menu-modal { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) translateY(120%); width: 400px; z-index: 2400; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  #menu-modal.active { transform: translateX(-50%) translateY(0); }
  #menu-bg { width: 100%; display: block; filter: drop-shadow(0 -5px 15px rgba(0,0,0,0.8)); }
  .menu-click-area { position: absolute; cursor: pointer; }
  #btn-menu-info { left: 14%; top: 23%; width: 13%; height: 9%; }
  #btn-menu-setting { left: 33%; top: 23%; width: 13%; height: 9%; }
  #btn-menu-home { left: 52%; top: 23%; width: 13%; height: 9%; }
  #btn-menu-close-bottom { left: 38.5%; bottom: 1%; width: 23%; height: 5%; }

  /* 說明與設定彈窗 (保留老虎機的排版，配色微調為捕魚機深海風) */
  #info-modal, #setting-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 2600; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; pointer-events: none; }
  #info-modal.active, #setting-modal.active { opacity: 1; visibility: visible; pointer-events: auto; }
  
  .info-content { background: linear-gradient(180deg, #001f3f 0%, #000c18 100%); width: 500px; border-radius: 20px; border: 2px solid #00bbff; padding: 25px; text-align: center; box-shadow: 0 0 30px rgba(0, 187, 255, 0.5); }
  .setting-box { background: linear-gradient(180deg, #002844 0%, #001122 100%); width: 350px; border-radius: 15px; border: 3px solid #00aaff; padding: 25px; text-align: center; box-shadow: 0 0 30px rgba(0, 170, 255, 0.6); }
  
  /* --- Info Modal Tabs 樣式 (Carnival 風格) --- */
        .info-tabs { display: flex; justify-content: space-between; border-bottom: 2px solid #8a2be2; margin-bottom: 15px; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; color: #aaa; font-size: 1.8vh; font-weight: bold; cursor: pointer; padding: 5px 10px; transition: 0.2s; font-family: 'Arial Black', sans-serif; text-shadow: 1px 1px 0 #000; }
        .tab-btn:hover { color: #fff; text-shadow: 0 0 8px #ff00ff; }
        .tab-btn.active { color: #ffd700; text-shadow: 0 0 10px #ff8c00; border-bottom: 3px solid #ffd700; margin-bottom: -7px; }
        
        .info-body { background: rgba(0, 0, 0, 0.4); border: 1px solid #8a2be2; border-radius: 10px; padding: 12px; text-align: left; height: 50vh; overflow-y: auto; }
        .info-body::-webkit-scrollbar { width: 8px; }
        .info-body::-webkit-scrollbar-thumb { background-color: rgba(255, 215, 0, 0.6); border-radius: 10px; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .info-title { font-size: 28px; color: #00e5ff; font-weight: bold; text-shadow: 0 0 10px #000; margin-bottom: 15px; }
  .close-btn { background: linear-gradient(180deg, #00bfff, #0077aa); padding: 10px 40px; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; color: white; border: 2px solid #88ddff; transition: transform 0.1s; display: inline-block; }
  .close-btn:active { transform: scale(0.95); }

  /* Toggle 黃金撥動開關 (完全照搬老虎機) */
  .toggle-switch { position: relative; display: inline-block; width: 60px; height: 34px; margin: 15px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: #ffd700; }
  input:checked + .slider:before { transform: translateX(26px); }

  /* 💸 飛行金幣的 HTML 樣式 (效能優化版) */
  .flying-coin-element {
    position: absolute;
    top: 0; left: 0; /* 固定原點，靠 JS 的 translate3d 移動 */
    width: 36px;  
    height: 36px;
    z-index: 100; 
    pointer-events: none; 
    /* ★ 絕對禁止在這裡放 transition！ */
    will-change: transform; /* 強制開啟 GPU 硬體加速 */
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }

  /* ── 墊底模糊背景（填滿整個螢幕，拉伸不保比例）── */
  #bgBlur {
    position:fixed; inset:0; z-index:0;
    overflow:hidden;
    background:#000;
  }
  /* 墊底模糊層內的 video（動態）或 img（靜態 fallback）*/
  #bgBlur video, #bgBlur img {
    position:absolute; inset:0;
    width:100%; height:100%;
    
    /* 👇 ★ 將原本的 object-fit: fill; 改為 cover; */
    object-fit: cover;      
    
    filter:blur(18px) brightness(0.4) saturate(1.3);
    transform:scale(1.2); 
    pointer-events:none;
  }

  /* ── 全畫面縮放容器 ── */
  #scaleWrapper {
    position:absolute;
    top:50%; left:50%;
    transform-origin:center center;
    z-index:1;
    /* JS 會動態設定 transform */
  }

  /* ── 遊戲本體固定 1280×720 ── */
  #gameWrapper {
    position:relative;
    width:1280px;
    height:720px;
    overflow:hidden;
    border-radius:16px; /* 稍微加大圓角，讓視覺更滑順 */
    
    /* 1. 移除了原本的 border (黃色實體框) */
    
    /* 2. 改用深海色的外陰影，以及一個「內陰影 (inset)」來讓畫面邊緣自然暗化融入背景 */
    box-shadow: 
      0 0 80px rgba(0, 15, 40, 0.85),       /* 往外暈染的深色背景光 */
      inset 0 0 60px rgba(0, 15, 40, 0.7);  /* 往內吃掉銳利邊緣的深海暗角 */
  }

  /* ── 🎬 電影感漸層遮罩 (三邊：左、右、下) ── */
  .edge-mask {
    position: absolute;
    z-index: 2;         /* 放在 Canvas 之上，低於 UI */
    pointer-events: none; /* 確保不擋住滑鼠點擊 */
  }

  /* 底部遮罩 (維持原本的，可以稍微加深點，高度 140px) */
  .bottom-mask {
    bottom: 0;
    left: 0;
    width: 100%;
    height: 140px; 
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
  }

  /* 左側遮罩 (寬度 100px) */
  .left-mask {
    top: 0;
    left: 0;
    width: 100px;
    height: 100%;
    /* 從左邊深黑色到右邊透明 */
    background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
  }

  /* 右側遮罩 (寬度 100px) */
  .right-mask {
    top: 0;
    right: 0;
    width: 100px;
    height: 100%;
    /* 從右邊深黑色到左邊透明 */
    background: linear-gradient(to left, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
  }

  #gameCanvas {
    display:block;
    cursor:none; /* 用自訂準心取代 */
  }

  /* 💥 100連擊狂熱金光遮罩 (GPU 硬體加速 + 順暢熄滅冷卻) */
  #feverOverlay {
    position: absolute; inset: 0; z-index: 9;
    pointer-events: none;
    mix-blend-mode: screen; 
    opacity: 0;
    /* ★ 將熄滅時間拉長到 0.8 秒，營造連擊中斷後，高溫「逐漸冷卻」的滑順視覺感 */
    transition: opacity 0.8s ease-out; 
    will-change: opacity;
  }
  
  /* 當 JS 加上 active 時，父層觸發平滑淡入 */
  #feverOverlay.active {
    opacity: 1;
  }
  
  /* ★ 核心修正：將「漸層背景」與「呼吸閃爍動畫」獨立放到偽元素裡面！
     這樣當 JS 移除 active 狀態時，父層的 transition 淡出才不會被強制切斷 */
  #feverOverlay::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 200, 0, 0.4) 60%, rgba(255, 140, 0, 0.8) 100%);
    animation: feverPulse 0.4s ease-in-out infinite alternate;
  }
  
  @keyframes feverPulse {
    from { opacity: 0.4; }
    to { opacity: 1.0; }
  }

  /* ── 🔥 Combo 系統樣式 (白邊升級版) ── */
  #comboDisplay {
    position: absolute;
    top: 8%; right: 5%;
    z-index: 15;
    font-family: 'Arial', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 55px;
    -webkit-text-stroke: 2px #ffffff; 
    color: #ff8800;
    text-shadow: 0 0 15px #ff3300, 5px 5px 5px rgba(0,0,0,0.8);
    pointer-events: none;
    
    /* ★ 核心修正：將縮放與旋轉的「錨點」釘在右邊！這樣字數增加放大時，只會往左邊延伸，不會出鏡！ */
    transform-origin: right center;
    
    opacity: 0;
    /* ★ 起始尺寸再縮小 50% (從原本的 0.5 變成 0.25) */
    transform: scale(0.25) rotate(-10deg);
    transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-out;
  }
  #comboDisplay.active {
    opacity: 1;
  }

  /* ── 新版底部 UI 樣式 ── */
  #newBottomBar {
    position: absolute; left: 0; width: 1280px; height: 95px; z-index: 10;
    transform: scale(0.65);             
    transform-origin: center bottom;   
    
    /* ★ UI 進場動畫 (初始隱藏狀態：往下沉 150px) */
    bottom: -150px; 
    opacity: 0;
    /* ★ 物理彈性特效 (cubic-bezier 創造回彈感) */
    transition: bottom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease-out;
  }

  /* ★ UI 進場動畫 (完成狀態：歸位) */
  #newBottomBar.slide-in {
    bottom: 0;
    opacity: 1;
  }
    
  .ui-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .hitbox { position: absolute; cursor: pointer; z-index: 10; }
  
  /* 金幣區 */
  #coinBox { position: absolute; left: 80px; bottom: 10px; height: 55px; display: flex; align-items: center; width: 280px; z-index: 5; pointer-events: none;}
  .coin-icon { height: 42px; margin-right: 12px; margin-bottom: 2px; }
  #coinsDisplay { 
    color: #ffd700; font-size: 38px; font-weight: bold; 
    font-family: 'Arial', sans-serif; text-shadow: 0 2px 5px rgba(0,0,0,0.9); 
    margin-top: 4px; 
    /* 👇 加入下面這兩行，賦予彈跳動畫能力 */
    transition: transform 0.1s; 
    transform-origin: left center; 
  }

  /* ── 🟢 獨立的實體加減按鈕 ── */
  .bet-btn {
    position: absolute;
    width: 110px;   /* ★ 變大：從 55px 放大到 76px，手感更好 */
    height: 85px;  /* ★ 變大 */
    cursor: pointer;
    z-index: 2;    /* ★ 降級：把層級降到 2，乖乖躲在砲管(z-index:3)底下 */
    transition: transform 0.05s ease-out, filter 0.05s ease-out;
    -webkit-user-drag: none;
  }

  /* ✨ 按下時的特效：稍微縮小 + 變暗 */
  .bet-btn:active {
    transform: scale(0.92);
    filter: brightness(0.75) contrast(1.1);
  }

  /* ★ 重新對齊：因為按鈕變大了，所以座標要稍微往「左下」微調來置中 */
  #betDown { left: 422px; bottom: 0px; } 
  #betUp { left: 745px; bottom: 0px; }

  /* 砲台與砲座 */
  /* 將整個大砲群組設為 z-index: 3 */
  #cannonContainer { position: absolute; left: 640px; bottom: 18px; width: 0; height: 0; z-index: 3; pointer-events: none; }
  
  /* 砲座在群組內墊底 (z-index: 1) */
  #cannonBase { position: absolute; left: -101px; bottom: -35px; width: 200px; z-index: 1; }
  
  /* 砲管壓在砲座上面 (z-index: 2) */
  #cannonBarrel { 
    position: absolute; left: -45px; bottom: 25px; width: 90px; 
    transform-origin: 50% 80%; 
    transition: filter 0.2s; 
    z-index: 2; 
  }

  /* 倍率顯示 */
  #betBg { position: absolute; left: 550px; bottom: 12px; width: 180px; height: 60px; z-index: 4; pointer-events: none; }
  #betDisplayOverlay { position: absolute; left: 550px; bottom: 18px; width: 180px; height: 55px; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
  #betDisplay { color: #fff; font-size: 28px; font-weight: bold; font-family: Arial; text-shadow: 0 0 8px #00e5ff, 0 2px 4px #000; margin-top: 4px; }
  
  /* 倍數文字設為 z-index: 5，必須在最頂層才不會被圖檔吃掉 */
  #betDisplayOverlay { position: absolute; left: 552px; bottom: 14px; width: 180px; height: 60px; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
  #betDisplay { color: #fff; font-size: 30px; font-weight: bold; font-family: Arial; text-shadow: 0 0 8px #00e5ff, 0 2px 4px #000; }

  /* 自動射擊 */
  #autoBtn { position: absolute; left: 865px; bottom: 15px; width: 125px; height: 55px; display: flex; align-items: center; justify-content: center; z-index: 5; cursor: pointer;}
  #autoText { color: #aaddff; font-size: 22px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: all 0.2s; margin-top: 2px; }
  #autoBtn.active #autoText { color: #00e676; text-shadow: 0 0 12px #00e676, 0 2px 4px #000; }

  /* 分數區 */
  #scoreBox { position: absolute; left: 985px; bottom: 8px; width: 250px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; pointer-events: none;}
  .score-label { color: #aaddff; font-size: 20px; margin-bottom: 0px; text-shadow: 0 1px 2px #000;}
  .score-values { display: flex; align-items: baseline; gap: 4px; }
  /* ── 修改後的積分數字樣式 ── */
  #scoreDisplay { 
    color: #ffd700; 
    font-size: 25px;          /* ★ 1. 放大至與左邊金幣一致 (原 28px) */
    font-weight: bold; 
    font-family: 'Arial', sans-serif; /* ★ 2. 指定字體一致 */
    text-shadow: 0 2px 5px rgba(0,0,0,0.9); /* ★ 3. 套用深色陰影，增加立體感 */
    margin-top: 0px; 
    display: inline-block;
    transition: transform 0.1s; 
    transform-origin: center center;
  }

  .score-max { 
    color: #888; 
    font-size: 24px;          /* 保持稍微縮小，營造目標感 */
    font-family: 'Arial', sans-serif; /* ★ 字體同步 */
    font-weight: bold;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  }

  /* ── Boss 警告遮罩 ── */
  #bossAlert {
    display:none;
    position:absolute; inset:0; z-index:10;
    pointer-events:none;
    border:4px solid transparent;
    border-radius:8px;
    /* ★ 效能優化：動畫預設暫停，只在 .show 時才啟動，避免背景持續佔用 Compositor thread */
    animation: bossFlash 0.4s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes bossFlash {
    from { border-color: rgba(255,30,30,0); box-shadow: inset 0 0 0px rgba(255,30,30,0); }
    to   { border-color: rgba(255,30,30,0.9); box-shadow: inset 0 0 60px rgba(255,30,30,0.25); }
  }
  #bossAlert.show { display:block; animation-play-state: running; }

  /* ── Boss HP 條 ── */
  #bossHpBar {
    display:none;
    position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
    width:600px; z-index:10; pointer-events:none;
    text-align:center;
  }
  #bossHpBar.show { display:block; }
  #bossHpLabel {
    color:#ff4444; font-size:14px; font-weight:bold; letter-spacing:2px;
    font-family:'Arial',sans-serif; text-shadow:0 0 8px #f00;
    margin-bottom:4px;
  }
  #bossHpTrack {
    width:100%; height:18px; background:rgba(0,0,0,0.7);
    border:1px solid #ff4444; border-radius:9px; overflow:hidden;
    box-shadow: 0 0 12px rgba(255,0,0,0.5);
  }
  #bossHpFill {
    height:100%; width:100%;
    background: linear-gradient(90deg, #ff2200, #ff6600, #ffaa00);
    border-radius:9px;
    transition: width 0.1s;
  }

  /* ── Boss 入場文字 ── */
  #bossTitle {
    display:none;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:15; pointer-events:none;
    color:#ff3300; font-size:64px; font-weight:bold;
    font-family:'Arial',sans-serif; letter-spacing:6px;
    text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4400;
    animation: bossTitleAnim 0.15s ease-in-out infinite alternate;
  }
  @keyframes bossTitleAnim {
    from { transform:translate(-50%,-50%) scale(1.0); }
    to   { transform:translate(-50%,-50%) scale(1.05); }
  }
  #bossTitle.show { display:block; }

  /* ── Boss 倒數計時器 ── */
  #bossTimer {
    display:none;
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    z-index:11; pointer-events:none;
    text-align:center;
  }
  #bossTimer.show { display:block; }
  #bossTimerNum {
    color:#fff; font-size:36px; font-weight:bold;
    font-family:'Arial',sans-serif;
    text-shadow: 0 0 20px rgba(255,80,0,0.9), 0 0 40px rgba(255,80,0,0.5);
    line-height:1;
  }
  #bossTimerNum.urgent { color:#ff3300; animation: urgentPulse 0.3s ease-in-out infinite alternate; }
  @keyframes urgentPulse {
    from { transform:scale(1.0); }
    to   { transform:scale(1.15); }
  }
  #bossTimerLabel {
    color:#ffaa44; font-size:11px; letter-spacing:2px;
    font-family:'Arial',sans-serif;
    margin-top:2px;
  }

  /* ── Boss 結算面板 ── */
  #bossResult {
    display:none;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:20;
    background:rgba(0,0,0,0.82);
    border:2px solid #ffaa00;
    border-radius:14px;
    padding:28px 48px;
    text-align:center;
    min-width:340px;
    box-shadow:0 0 40px rgba(255,160,0,0.5);
  }
  #bossResult.show { display:block; }
  #bossResult h2 {
    color:#ffd700; font-size:22px; letter-spacing:3px;
    font-family:'Arial',sans-serif; margin-bottom:16px;
  }
  .result-row {
    display:flex; justify-content:space-between; align-items:center;
    color:#ccc; font-size:14px; font-family:'Arial',sans-serif;
    padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .result-row span:last-child { color:#ffd700; font-weight:bold; font-size:16px; }
  .result-total {
    margin-top:12px; color:#fff; font-size:18px;
    font-family:'Arial',sans-serif; font-weight:bold;
  }
  .result-total span { color:#ffd700; font-size:24px; }
  #bossResultClose {
    margin-top:18px;
    background:linear-gradient(135deg,#cc8800,#ffcc00);
    border:none; border-radius:8px;
    padding:10px 36px; font-size:15px; font-weight:bold;
    color:#000; cursor:pointer; letter-spacing:2px;
    font-family:'Arial',sans-serif;
  }
  #bossResultClose:hover { background:linear-gradient(135deg,#ffcc00,#ffe066); }

  /* ── ⏳ Loading 蓋板樣式 ── */
  #loadingScreen {
    position: fixed; inset: 0; z-index: 9999;
    /* ★ 改為 contain：保證全圖完整顯示，但太寬扁的螢幕左右兩側會有黑邊 */
    background: url('Loading.jpg') center / contain no-repeat #000;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 8%;

function applyScale(){
  const scaleX = window.innerWidth  / W;

  const scale  = Math.min(scaleX, scaleY);
  const wrapper = document.getElementById('scaleWrapper');
  wrapper.style.transform = `translate(-50%,-50%) scale(${scale})`;
  return scale;
}
let currentScale = applyScale();
window.addEventListener('resize', ()=>{ currentScale = applyScale(); });

function toLogical(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) / currentScale, y: (clientY - rect.top) / currentScale };
}

// ════════════════════════════════════════════
//  🎵 音效引擎 (Web Audio API + file:/// 相容版)
// ════════════════════════════════════════════
const AudioEngine = {
  ctx: null,
  buffers: {},
  bgmEnabled: true, // ★ 新增：獨立的音樂開關狀態
  sfxEnabled: true, // ★ 獨立的音效開關狀態
  bgmSource: null,
  bgmGain: null,
  // ★ Audio Pool fallback（file:/// 協議下 fetch 被 CORS 封鎖時使用）
  _pool: {},
  _bgmAudio: null,
  _usePool: false,

  // 輔助：用 XHR 讀取二進制（相容 file:/// 協議）
  _fetchArrayBuffer(src) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', src, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = () => xhr.status === 0 || xhr.status === 200
        ? resolve(xhr.response)
        : reject(new Error(`HTTP ${xhr.status}`));
      xhr.onerror = () => reject(new Error('XHR error'));
      xhr.send();
    });
  },

  // 在 startBtn 點擊後呼叫，預先解碼所有音效
  async preload(srcs) {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (const src of srcs) {
        try {
          // ★ 先嘗試 fetch，若失敗（file:///）改用 XHR
          let arrayBuffer;
          try {
            const res = await fetch(src);
            arrayBuffer = await res.arrayBuffer();
          } catch(e) {
            arrayBuffer = await this._fetchArrayBuffer(src);
          }
          this.buffers[src] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch(e) {
          console.warn(`Web Audio 載入失敗，切換 Audio Pool: ${src}`, e);
          this._usePool = true; // 任一失敗就整體切換
        }
      }
    } catch(e) {
      console.warn('AudioContext 建立失敗，使用 Audio Pool:', e);
      this._usePool = true;
    }
  },

  // 開槍時呼叫 (僅受 sfxEnabled 控制)
  play(src, volume = 1.0) {
    if (!this.sfxEnabled) return; // ★ 檢查音效開關
    // ★ Web Audio API 路徑
    if (!this._usePool && this.ctx && this.buffers[src]) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const source = this.ctx.createBufferSource();
      source.buffer = this.buffers[src];
      const gainNode = this.ctx.createGain();
      gainNode.gain.value = volume;
      source.connect(gainNode);
      gainNode.connect(this.ctx.destination);
      source.start(0);
      return;
    }
    // ★ Audio Pool fallback
    if (!this._pool[src]) this._pool[src] = [];
    let sound = this._pool[src].find(a => a.paused || a.ended);
    if (!sound) {
      if (this._pool[src].length >= 10) return;
      sound = new Audio(src);
      this._pool[src].push(sound);
    }
    sound.volume = volume;
    sound.currentTime = 0;
    sound.play().catch(() => {});
  },

  // 播放循環背景音樂 (僅受 bgmEnabled 控制)
  playBGM(src, volume = 0.4) {
    // ★ Web Audio API 路徑
    if (!this._usePool && this.ctx && this.buffers[src]) {
      if (this.bgmSource) { try { this.bgmSource.stop(); } catch(e) {} }
      const source = this.ctx.createBufferSource();
      source.buffer = this.buffers[src];
      source.loop = true;
      const gainNode = this.ctx.createGain();
      gainNode.gain.value = this.bgmEnabled ? volume : 0; // ★ 改用 bgmEnabled 判斷
      source.connect(gainNode);
      gainNode.connect(this.ctx.destination);
      source.start(0);
      this.bgmSource = source;
      this.bgmGain = gainNode;
      return;
    }
    // ★ Audio Pool fallback
    if (!this._bgmAudio) {
      this._bgmAudio = new Audio(src);
      this._bgmAudio.loop = true;
      this._bgmAudio.volume = volume;
    }
    this._bgmAudio.muted = !this.bgmEnabled; // ★ 改用 bgmEnabled 判斷
    this._bgmAudio.play().catch(() => {});
    this._bgmAudio.muted = !this.bgmEnabled; // ★ 改用 bgmEnabled 判斷
  }
};

    const spriteNodes = document.querySelectorAll('.paytable-sprite');
    
    // ★ 效能優化 2：預先將所有 data-* 屬性讀取到純 JS 記憶體中，拒絕在迴圈內讀取 DOM！
    const spritesData = Array.from(spriteNodes).map(el => ({
        el: el,
        frames: parseInt(el.getAttribute('data-frames'), 10) || 1,
        cols: parseInt(el.getAttribute('data-cols'), 10) || 1,
        rows: parseInt(el.getAttribute('data-rows'), 10) || 1,
        currentFrame: parseInt(el.getAttribute('data-current-frame'), 10) || 0
    }));

    window.paytableAnimTimer = setInterval(() => {
        // 【效能保護】只有當 info-modal 打開時才去計算動畫
        if (!infoModal || !infoModal.classList.contains('active')) return;

        spritesData.forEach(spr => {
            if (spr.frames <= 1) return; // 單張靜態圖就直接跳過

            // 在純 JS 記憶體中推進一幀
            spr.currentFrame = (spr.currentFrame + 1) % spr.frames;

            // 計算精準的 X 與 Y 軸位置
            const xIndex = spr.currentFrame % spr.cols;
            const yIndex = Math.floor(spr.currentFrame / spr.cols);

            const xPos = spr.cols > 1 ? (xIndex / (spr.cols - 1)) * 100 : 0;
            const yPos = spr.rows > 1 ? (yIndex / (spr.rows - 1)) * 100 : 0;

            // ★ 效能優化 3：每一幀只負責「寫入」，完全沒有「讀取」，效能開銷趨近於 0
            spr.el.style.backgroundPosition = `${xPos}% ${yPos}%`;
        });
    }, 45); 
}

const drillImg = new Image();
drillImg.src = '鑽頭.png';
let drillWeapon = {
  state: 'none', // 狀態切換：'none', 'flying', 'ready', 'fired'
  x: 0, y: 0, vx: 0, vy: 0, angle: 0,
  bounceCount: 0, betAmount: 10
};
// ★ 新增：獨立的鑽頭砲發射核心控制器 (手動與自動共用)
function launchDrill(angle) {
  drillWeapon.state = 'fired';
  drillWeapon.angle = angle;
  drillWeapon.bounceCount = 0;
  const drillSpeed = 16; // 鑽頭的高速飛行速度
  drillWeapon.vx = Math.cos(angle) * drillSpeed;
  drillWeapon.vy = Math.sin(angle) * drillSpeed;
  
  // 讓鑽頭物理座標精準從大砲前端噴射出去 (管長約 70px)
  drillWeapon.x = cannon.x + Math.cos(angle) * 70;
  drillWeapon.y = cannon.y + Math.sin(angle) * 70;
  
  triggerScreenShake(0.3, 15); // 發射時的強烈後座力震動
  AudioEngine.play(SOUNDS.shoot3, 1.0); // 播放發射巨響
}
function updateDrawDrill(dt) {
  if (drillWeapon.state === 'none' || !drillImg.complete) return;

  ctx.save();
  // ── 階段 1：擊殺後，鑽頭飛向砲台 ──
  if (drillWeapon.state === 'flying') {
    const dx = cannon.x - drillWeapon.x;
    const dy = cannon.y - drillWeapon.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist < 20) {
        drillWeapon.state = 'ready';
        drillWeapon.readyTimer = 3.0; // ★ 核心修改：吸附在砲塔上的那一瞬間，正式啟動 3 秒倒數計時！
        AudioEngine.play(SOUNDS.shoot2, 0.8); // 裝填完成音效
    } else {
        drillWeapon.x += dx * 0.12; 
        drillWeapon.y += dy * 0.12;
    }
    
    ctx.translate(drillWeapon.x, drillWeapon.y);
    ctx.rotate(Date.now() * 0.02); 
    ctx.drawImage(drillImg, -50, -50, 100, 100); 
  } 
  // ── 階段 2：裝填完成，覆蓋在砲管上等待發射 (跟隨滑鼠轉動 + 3秒倒數) ──
  else if (drillWeapon.state === 'ready') {
    // 1. 扣除蓄力倒數秒數
    drillWeapon.readyTimer -= dt;
    
    // 2. 防呆判定：如果玩家 3 秒內都沒開火，時間到就強制幫玩家自動射出！
    if (drillWeapon.readyTimer <= 0) {
        launchDrill(cannon.angle);
        ctx.restore();
        return;
    }

    // 3. 渲染青藍色的科幻倒數霓虹字體 (保持正向，不會跟著大砲顛倒)
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 10;
    ctx.fillText(`READY: ${Math.ceil(drillWeapon.readyTimer)}s`, cannon.x, cannon.y - 95);
    ctx.shadowBlur = 0; // 重置陰影，避免污染後續繪圖

    // 4. 變換矩陣，讓鑽頭完美覆蓋在當前大砲朝向的砲口上
    const offset = 40; 
    ctx.translate(cannon.x + Math.cos(cannon.angle) * offset, cannon.y + Math.sin(cannon.angle) * offset);
    ctx.rotate(cannon.angle);
    ctx.drawImage(drillImg, 0, -45, 150, 90); 
  } 
  // ── 階段 3：射出！貫穿全場與邊界彈射 ──
  else if (drillWeapon.state === 'fired') {
    drillWeapon.x += drillWeapon.vx * dt * 60;
    drillWeapon.y += drillWeapon.vy * dt * 60;

    // 邊界反彈邏輯 (最多彈射 5 次)
    if (drillWeapon.bounceCount < 5) {
        let bounced = false;
        if (drillWeapon.x < 0) { drillWeapon.x = 0; drillWeapon.vx *= -1; bounced = true; }
        else if (drillWeapon.x > W) { drillWeapon.x = W; drillWeapon.vx *= -1; bounced = true; }
        
        if (drillWeapon.y < 0) { drillWeapon.y = 0; drillWeapon.vy *= -1; bounced = true; }
        else if (drillWeapon.y > H) { drillWeapon.y = H; drillWeapon.vy *= -1; bounced = true; }

        if (bounced) {
            drillWeapon.bounceCount++;
            drillWeapon.angle = Math.atan2(drillWeapon.vy, drillWeapon.vx);
            spawnRipple(drillWeapon.x, drillWeapon.y, 1.2); 
            triggerScreenShake(0.15, 12); 
        }
    }

    ctx.translate(drillWeapon.x, drillWeapon.y);
    ctx.rotate(drillWeapon.angle);
    
    spawnParticles(drillWeapon.x - Math.cos(drillWeapon.angle)*70, drillWeapon.y - Math.sin(drillWeapon.angle)*70, '#00ffff', 4, 4, 12, 15);
    ctx.drawImage(drillImg, -75, -45, 150, 90);

    // 碎甲貫穿傷害判定
    const hitRadius = 55;
    for (let f of fishes) {
        if (f.dead || f.x < -100 || f.x > W+100 || f.y < -100 || f.y > H+100) continue;
        if (dist(drillWeapon.x, drillWeapon.y, f.x, f.y) < hitRadius + f.size/2) {
            f.hp -= drillWeapon.betAmount * 5; 
            f.hitFlash = 3;

            if (f.hp <= 0 && !f.dead) {

                comboCount++; comboTimer = 2.5; updateComboUI();
                let won = drillWeapon.betAmount * f.mult;

                spawnFloatingText(f.x, f.y, `+${finalWon} 鑽孔!`, 60, '#00ffff', 28);
                _hudDirty = true;

    if (boss.state === 'active' || boss.state === 'entering') {

       if (dist(drillWeapon.x, drillWeapon.y, boss.x, boss.y) < hitRadius + bSize * 0.8) {
            boss.hp -= drillWeapon.betAmount * 15;
            boss.hitFlash = 3;

            if (boss.hp <= 0 && boss.state !== 'dying') {
                boss.state = 'dying'; boss.enterTimer = 2.5; bossTimerActive = false; if(_domCache.bossTimer) _domCache.bossTimer.classList.remove('show');
                for(let k=0; k<5; k++){ setTimeout(()=>{ spawnExplosion(boss.x+rand(-200,200), boss.y+rand(-150,150), rand(1.5,3.0)); spawnParticles(boss.x+rand(-200,200), boss.y+rand(-150,150),'#ffd700',20,3,10,60,true); }, k*300); }
                spawnFloatingText(boss.x, boss.y-100, 'BOSS 擊殺！', 120, '#ffee00', 30);
                spawnFlyingCoins(boss.x, boss.y, 100);
                setTimeout(()=> settleBossResult(true), 800);
            }
       }
    }

    if (drillWeapon.bounceCount >= 5 && (drillWeapon.x < -200 || drillWeapon.x > W+200 || drillWeapon.y < -200 || drillWeapon.y > H+200)) {
        drillWeapon.state = 'none';
    }
  }
  ctx.restore();
}

function triggerScreenShake(duration, intensity) {

function updateDrawBombs(dt) {
  if (!bombImg.complete) return;
  
  for (let i = bombs.length - 1; i >= 0; i--) {
    let b = bombs[i];
    b.timer += dt;
    let progress = b.timer / b.maxTime; 

    // 計算縮放與心跳脈動
    let pulseFreq = 5 + progress * 25; 
    let pulseVal = Math.sin(progress * Math.PI * pulseFreq);
    let scale = 0.6 + progress * 1.0 + Math.max(0, pulseVal) * 0.15; 
    let size = 150 * scale; 

    ctx.save();
    ctx.translate(b.x, b.y);

    // ★ 1. 畫出原本的炸彈
    ctx.drawImage(bombImg, -size/2, -size/2, size, size);

    // ★ 2. 疊加完美去背的「紅色炸彈」，利用透明度創造脹紅感！
    if (progress > 0 && redBombCanvas.width > 0) {
      ctx.globalAlpha = Math.min(1, progress * 0.8 + Math.max(0, pulseVal) * 0.2);
      ctx.drawImage(redBombCanvas, -size/2, -size/2, size, size);
      ctx.globalAlpha = 1.0; // 重置透明度
    }
    ctx.restore();

    // ★ 3. 倒數結束，引發全畫面核爆！
    if (b.timer >= b.maxTime) {
      triggerScreenShake(0.8, 40);

          setTimeout(()=> settleBossResult(true), 800);

// 🎡 幸運輪盤引擎 (Lucky Roulette System) 🎡
// ==========================================
const rouletteImg = new Image(); rouletteImg.src = '幸運輪盤.png';
const pointerImg = new Image(); pointerImg.src = '輪盤指針.png';

// 定義輪盤上 8 個格子的倍率 (對應 45 度角的 8 個切片)
const ROULETTE_SLICES = [100, 15, 50, 20, 80, 10, 40, 30]; 

let roulette = {
  state: 'none', // 狀態：'none', 'entering', 'spinning', 'rewarding', 'exiting'
  timer: 0,
  angle: 0,
  startAngle: 0,
  targetAngle: 0,
  spinDuration: 5.0, // 旋轉 5 秒，營造期待感
  scale: 0,
  targetSlice: 0,
  betAmount: 0
};

function triggerRoulette(bet) {
  roulette.state = 'entering';
  roulette.timer = 0;
  roulette.scale = 0;
  roulette.betAmount = bet;
  roulette.startAngle = roulette.angle % (Math.PI * 2);

  // 🎲 決定中獎格 (目前為純隨機，若要控制機率可在此修改權重)
  roulette.targetSlice = Math.floor(Math.random() * 8);
  
  // 計算目標角度 (讓中獎格完美停在正上方 - 指針處)
  // ★ PNG 分格線在 0/45/90...度，格子中心在 22.5/67.5...度，需加 π/8 補正
  const SLICE_OFFSET = Math.PI / 8; // 22.5 度，讓格子中心對齊指針
  let targetA = -(roulette.targetSlice * (Math.PI / 4)) - SLICE_OFFSET;
  
  // 確保順時針旋轉，並額外多轉 8 圈來營造「狂轉」的視覺張力
  let rotationDiff = targetA - roulette.startAngle;
  while (rotationDiff <= 0) rotationDiff += Math.PI * 2;
  roulette.targetAngle = roulette.startAngle + rotationDiff + Math.PI * 2 * 8;
  
  // ★ 1. 擊中（輪盤彈出）時播放 wheel01.mp3
  AudioEngine.play(SOUNDS.wheel1, 1.0); 
}

function updateDrawRoulette(dt) {
  if (roulette.state === 'none' || !rouletteImg.complete || !pointerImg.complete) return;

  const cx = W / 2;
  const cy = H / 2;
  
  // 1. 畫全畫面半透明黑幕 (聚焦輪盤，讓背景變暗)
  ctx.save();
  ctx.fillStyle = 'rgba(0, 5, 15, 0.8)';
  ctx.fillRect(0, 0, W, H);

  // 2. 狀態機邏輯處理
  if (roulette.state === 'entering') {
    roulette.timer += dt;
    let p = roulette.timer / 0.5;
    if (p >= 1) { 
        p = 1; 
        roulette.state = 'spinning'; 
        roulette.timer = 0; 
        // ★ 2. 輪盤開始瘋狂轉動時，播放 wheel02.mp3
        AudioEngine.play(SOUNDS.wheel2, 1.0); 
    }
    // 彈性放大特效 (Overshoot)
    const c1 = 1.70158;
    roulette.scale = 1 + (c1 + 1) * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); 
  } 
  else if (roulette.state === 'spinning') {
    roulette.timer += dt;
    let p = roulette.timer / roulette.spinDuration;
    if (p >= 1) { 
      p = 1; 
      roulette.state = 'rewarding'; 
      roulette.timer = 0;
      
      // 🛑 停定發獎！
      let mult = ROULETTE_SLICES[roulette.targetSlice];
      let won = roulette.betAmount * mult;
      sessionScore += won;
      
      // 👇 ★ 1. 呼叫全新的大獎噴泉金幣！(數量會依照 won 金額自動暴增)
      spawnJackpotCoins(cx, cy, won); 
      
      // 👇 ★ 2. 加入強烈的視覺衝擊 (螢幕震動 + 瞬間白光閃爍)
      triggerScreenShake(0.6, 25);
      whiteFlashTimer = 0.8;
      AudioEngine.play(SOUNDS.wheel1, 0.8); // 借用警報聲當作 Jackpot 的震撼重音
      
      // 👇 ★ 3. 華麗的 Jackpot 文字浮現
      spawnFloatingText(cx, cy - 80, `JACKPOT! +${won}`, 150, '#ffcc00', 65);
      
      _hudDirty = true;
    }
    // Quartic Ease Out 緩動函數 (起步極快，最後平滑緩慢停下)
    let easeOut = 1 - Math.pow(1 - p, 4);
    roulette.angle = roulette.startAngle + (roulette.targetAngle - roulette.startAngle) * easeOut;
  }
  else if (roulette.state === 'rewarding') {
    roulette.timer += dt;
    if (roulette.timer > 3.0) { // 中獎後停留 3 秒讓玩家享受
      roulette.state = 'exiting';
      roulette.timer = 0;
    }
  }
  else if (roulette.state === 'exiting') {
    roulette.timer += dt;
    let p = roulette.timer / 0.4;
    if (p >= 1) { roulette.state = 'none'; ctx.restore(); return; }
    roulette.scale = 1 - Math.pow(p, 3); // 加速縮小消失
  }

  // 3. 開始繪製輪盤本體 (PNG 透明背景版)
  ctx.translate(cx, cy);
  ctx.scale(roulette.scale, roulette.scale);

  let rw = 500, rh = 500;
  
  // ★ 核心修正：輪盤本體 + 數字 + 中獎閃爍，全部一起旋轉！
  ctx.save();
  ctx.rotate(roulette.angle);
  
  // 增加外發光陰影，讓輪盤看起來更有懸浮的立體感
  ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
  ctx.shadowBlur = 30;
  
  ctx.drawImage(rouletteImg, -rw/2, -rh/2, rw, rh);
  
  // ★ 數字也在旋轉群組內，跟著輪盤一起轉
  // ★ 格子中心在 i*45 + 22.5 度，所以從 SLICE_OFFSET 開始畫
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 4 + Math.PI / 8); // ★ +22.5度，對齊格子中心
    ctx.translate(0, -rw * 0.36); 
    
    ctx.font = '900 42px Arial Black';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.strokeText(`${ROULETTE_SLICES[i]}x`, 0, 0);
    ctx.fillStyle = '#ffee00';
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 10;
    ctx.fillText(`${ROULETTE_SLICES[i]}x`, 0, 0);
    ctx.restore();
  }

  ctx.restore(); // 結束旋轉群組

  // ★ 中獎閃爍扇形：在旋轉群組【外面】，不受 roulette.angle 影響，永遠固定在正上方
  if (roulette.state === 'rewarding' && Math.floor(roulette.timer * 8) % 2 === 0) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, rw/2 - 20, -Math.PI/2 - Math.PI/8, -Math.PI/2 + Math.PI/8);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.shadowColor = 'rgba(255,255,200,0.8)';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.restore();
  }

  let pw = 90, ph = 120;
  ctx.drawImage(pointerImg, -pw/2, -rw/2 - ph * 0.35, pw, ph);

  ctx.restore();
}

//   bossLevel 從 0 開始，對應「第 1 關」
function getBossDefForLevel(level) {
  const list = ASSETS.bossList;
  if (list && list.length > 0) {
    const lvl = level + 1; // 轉為第幾關（1-based）
    for (const b of list) {
      const min = b.stageMin || 1;
      const max = (b.stageMax != null) ? b.stageMax : min;
      if (lvl >= min && lvl <= max) return b;
    }
    // 超過所有設定範圍 → 最後一隻 Boss 無限輪迴
    return list[list.length - 1];
  }
  // 向後相容：沒有 bossList 則用舊版 boss 物件
  return ASSETS.boss || {};
}

function settleBossResult(killedInTime){

  // 2. 準備結算變數

    let comboBonusRate = 1.0;
    let extraFlatBonus = 0;
    
    if (comboCount >= 2) {
      // 結算前 100 連擊的 % 數加成
      comboBonusRate = Math.min(2.0, 1 + (comboCount * 0.01));
      
      // 超過 100 連擊的部分，每下固定 +1 元
      if (comboCount > 100) {

      }
    }
    
    // 總 Combo 獎金 = (全額獎金 * 趴數) + 溢出固定獎金
    bossComboBonus = Math.floor(bossBounty * (comboBonusRate - 1.0)) + extraFlatBonus;

    bountyText = "✅ 擊敗全額獎金";
    
    // 處理武器解鎖提示文字
    if (bossLevel === 1) unlockText = "✨ 解鎖雙管重砲 (最高 50 倍) ✨";

  }

  // 3. 核心財務計算：總收入與淨利潤
  const totalIncome = baseCoins + bossBounty + bossComboBonus;
  const netProfit = totalIncome - stageTotalSpent; // 淨利 = 總收入 - 總消耗

  // 實際發錢
  coins += totalIncome;

  document.getElementById('rBaseCoins').innerHTML = `${sessionScore} 分 &rarr; <span style="color:#ffd700;">${baseCoins}</span>`;

  const profitEl = document.getElementById('rNetProfit');

    profitEl.innerHTML = `<span style="color:#00ffcc;">+${netProfit}</span>`;
  } else {

  }

  const unlockEl = document.getElementById('unlockMsg');

    unlockEl.innerHTML = unlockText;
    unlockEl.style.display = 'block';
  } else {
    unlockEl.style.display = 'none';
  }

  if(_domCache.bossResult) _domCache.bossResult.classList.add('show');

  boss.straightJourneyDir = startDir; 
  boss.straightDirection = startDir;  
  boss.straightTimer = 0;
  boss.straightTargetY = rand(150, H - 150); 

  // ── Circle (翡翠龍：四角半圓突襲) 初始化 ──
  boss.circlePhase = 'move';
  boss.circlePattern = Math.floor(Math.random() * 4);
  if (boss.circlePattern === 0) { boss.circleAngle = Math.PI; boss.circleCy = -300; boss.circleDir = -1; }
  else if (boss.circlePattern === 1) { boss.circleAngle = 0; boss.circleCy = -300; boss.circleDir = 1; }
  else if (boss.circlePattern === 2) { boss.circleAngle = Math.PI; boss.circleCy = H + 300; boss.circleDir = 1; }
  else { boss.circleAngle = Math.PI * 2; boss.circleCy = H + 300; boss.circleDir = -1; }

  // ── Figure8 (黃金鯊：四角α型深淵迴旋) 初始化 ──
  boss.figurePhase = 'move';
  boss.figurePattern = Math.floor(Math.random() * 4);

      boss.y = boss.straightTargetY;
  } else if (_activeBossDef.pathType === 'circle') {

      boss.y = boss.circleCy + Math.sin(boss.circleAngle) * (H + 100);
  } else if (_activeBossDef.pathType === 'figure8') {

function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

// 👇 從這裡開始往下全部複製，替換掉原本的 drawBoss 函式 👇
function drawBoss(dt){
  const bd = _activeBossDef;
  // ★ 新增 boss.state === 'warning'，讓 Boss 在 3 秒警報期間完全隱身
  if(boss.state === 'idle' || boss.state === 'dead' || boss.state === 'warning') return;

  const now = Date.now(); 
  let targetX = boss.x, targetY = boss.y; 
  const pt = bd.pathType || 'sine';
  // 保底全域變數
  const amp = bd.sineAmp || 25;
  const freq = bd.sineFreq || 0.0008;

  // ==========================================
  // ── Hover (大鯊魚：循環游擊) ──
  // ==========================================
  if (pt === 'hover' && boss.state !== 'dying') {
      if (boss.hoverPhase === 'move') {
          let lerpFactor = 3.5; 
          boss.x += (boss.hoverTargetX - boss.x) * lerpFactor * dt;
          boss.y += (boss.hoverTargetY - boss.y) * lerpFactor * dt;
          if (Math.abs(boss.hoverTargetX - boss.x) < 5 && Math.abs(boss.hoverTargetY - boss.y) < 5) {
              boss.x = boss.hoverTargetX; boss.y = boss.hoverTargetY;
              boss.hoverPhase = 'wait'; boss.hoverTimer = 3.0; 
          }
      } else if (boss.hoverPhase === 'wait') {
          const intensity = bd.hoverIntensity || 5;
          targetX = boss.hoverTargetX + (Math.random() - 0.5) * intensity;
          targetY = boss.hoverTargetY + (Math.random() - 0.5) * intensity;
          boss.x += (targetX - boss.x) * 0.1; boss.y += (targetY - boss.y) * 0.1;
          boss.hoverTimer -= dt;
          if (boss.hoverTimer <= 0) {
              boss.hoverPhase = 'exit';
              boss.hoverExitSpeed = 0; 
              boss.hoverDestX = boss.hoverDirection === 1 ? W + BOSS_DW : -BOSS_DW;
          }
      } else if (boss.hoverPhase === 'exit') {
          boss.hoverExitSpeed += 1800 * dt; 
          boss.x += boss.hoverDirection * boss.hoverExitSpeed * dt;
          if ((boss.hoverDirection === 1 && boss.x >= boss.hoverDestX) || 
              (boss.hoverDirection === -1 && boss.x <= boss.hoverDestX)) {
              boss.hoverPhase = 'delay'; boss.hoverTimer = 0.2; 
          }
      } else if (boss.hoverPhase === 'delay') {
          boss.hoverTimer -= dt;
          if (boss.hoverTimer <= 0) {
              boss.hoverDirection *= -1; // 嚴格交替
              boss.hoverPhase = 'move';
              boss.x = boss.hoverDirection === 1 ? -BOSS_DW : W + BOSS_DW;
              boss.hoverTargetY = rand(150, H - 150); boss.y = boss.hoverTargetY;
              boss.hoverTargetX = boss.hoverDirection === 1 ? rand(300, W/2 + 100) : rand(W/2 - 100, W - 300);
          }
      }
      targetX = boss.x; targetY = boss.y;
      if (boss.state === 'entering') boss.enterTimer -= dt;
  } 
  // ==========================================
  // ── Sine (克拉肯：波浪飄移) 動態變速版 ──
  // ==========================================
  else if (pt === 'sine' && boss.state !== 'dying') {
      let speed = 260 * dt; 
      // ★ 動態變速：在畫面外啟動極速滑行，防斷 Combo
      if (boss.x < -150 || boss.x > W + 150) {
          speed = 1200 * dt; 
      }

      const waveAmp = (bd.sineAmp && bd.sineAmp >= 50) ? bd.sineAmp : 220;   
      let waveFreq = bd.sineFreq || 0.015; 
      
      if (boss.sinePhase === 'move') {
          boss.x += boss.sineDirection * speed;
          boss.y = boss.sineBaseY + Math.sin(boss.x * waveFreq) * waveAmp;

          if ((boss.sineDirection === 1 && boss.x >= W + BOSS_DW) || 
              (boss.sineDirection === -1 && boss.x <= -BOSS_DW)) {
              boss.sinePhase = 'delay';
              boss.sineTimer = 0.2; 
          }
      } else if (boss.sinePhase === 'delay') {
          boss.sineTimer -= dt;
          if (boss.sineTimer <= 0) {
              boss.sineDirection *= -1; 
              boss.sinePhase = 'move';
              boss.x = boss.sineDirection === 1 ? -BOSS_DW : W + BOSS_DW;
              boss.sineBaseY = rand(250, H - 250);
              boss.y = boss.sineBaseY + Math.sin(boss.x * waveFreq) * waveAmp;
          }
      }
      
      targetX = boss.x; targetY = boss.y;
      if (boss.state === 'entering') boss.enterTimer -= dt;
  }
  // ==========================================
  // ── Straight (紫晶蟹：螃蟹步) 編輯器連動版 ──
  // ==========================================
  else if (pt === 'straight' && boss.state !== 'dying') {
      // ★ 安全轉型：強制轉為 Number，防止編輯器傳回字串導致數學運算變 NaN 當機
      const editorAmp = Number(bd.sineAmp) || 25;
      const editorFreq = Number(bd.sineFreq) || 0.0008;

      const speedRatio = editorFreq / 0.0008;
      const speed = 1000 * speedRatio * dt; 
      const exitAccel = 1500 * speedRatio;

      const durationOffset = (editorAmp - 25) * 0.2;
      const basePatrolDuration = Math.max(1.0, 3.0 + durationOffset);

      const edgePadding = 100; 

      if (boss.straightPhase === 'enter') {
          let destX = boss.straightJourneyDir === 1 ? edgePadding : W - edgePadding; 
          let lerpFactor = 3.0;
          boss.x += (destX - boss.x) * lerpFactor * dt;
          boss.y += (boss.straightTargetY - boss.y) * lerpFactor * dt;
          
          if (Math.abs(destX - boss.x) < 5) {
              boss.x = destX;
              boss.straightPhase = 'patrol';
              boss.straightTimer = basePatrolDuration + Math.random() * 2.0; 
              boss.straightDirection = -boss.straightJourneyDir; 
          }
      } else if (boss.straightPhase === 'patrol') {
          boss.x += boss.straightDirection * speed;
          boss.straightTimer -= dt;
          
          if (boss.x > W - edgePadding) {
              boss.x = W - edgePadding;
              boss.straightDirection = -1; 
          } else if (boss.x < edgePadding) {
              boss.x = edgePadding;
              boss.straightDirection = 1;  
          }
          
          if (boss.straightTimer <= 0) {
              boss.straightPhase = 'exit';
              boss.straightExitSpeed = 0;
              boss.straightDirection = boss.straightJourneyDir;
          }
      } else if (boss.straightPhase === 'exit') {
          boss.straightExitSpeed += exitAccel * dt; 
          boss.x += boss.straightJourneyDir * boss.straightExitSpeed * dt;
          
          if ((boss.straightJourneyDir === 1 && boss.x >= W + BOSS_DW) || 
              (boss.straightJourneyDir === -1 && boss.x <= -BOSS_DW)) {
              boss.straightPhase = 'delay';
              boss.straightTimer = 0.2; 
          }
      } else if (boss.straightPhase === 'delay') {
          boss.straightTimer -= dt;
          if (boss.straightTimer <= 0) {
              boss.straightJourneyDir *= -1; 
              boss.straightDirection = boss.straightJourneyDir; 
              boss.straightPhase = 'enter';
              boss.x = boss.straightJourneyDir === 1 ? -BOSS_DW : W + BOSS_DW;
              boss.straightTargetY = rand(150, H - 150); 
              boss.y = boss.straightTargetY;
          }
      }

      targetX = boss.x; targetY = boss.y;
      if (boss.state === 'entering') boss.enterTimer -= dt;
  }
  // ==========================================
  // ── Circle (翡翠龍：四角半圓突襲) ──
  // ==========================================
  else if (pt === 'circle' && boss.state !== 'dying') {
      const editorAmp = Number(bd.sineAmp) || 25;
      const editorFreq = Number(bd.sineFreq) || 0.0008;

      const speedRatio = editorFreq / 0.0008;
      const angularSpeed = 0.6 * speedRatio * dt; 

      const sizeOffset = (editorAmp - 25) * 10;
      const rx = (W / 2 + 300) + sizeOffset; 
      const ry = (H + 100) + sizeOffset;     
      const cx = W / 2;

      if (boss.circlePhase === 'move') {
          boss.circleAngle += boss.circleDir * angularSpeed;
          boss.x = cx + Math.cos(boss.circleAngle) * rx;
          boss.y = boss.circleCy + Math.sin(boss.circleAngle) * ry;

          let isDone = false;
          if (boss.circlePattern === 0 && boss.circleAngle <= 0) isDone = true;
          else if (boss.circlePattern === 1 && boss.circleAngle >= Math.PI) isDone = true;
          else if (boss.circlePattern === 2 && boss.circleAngle >= Math.PI * 2) isDone = true;
          else if (boss.circlePattern === 3 && boss.circleAngle <= Math.PI) isDone = true;

          if (isDone) {
              boss.circlePhase = 'delay';
              boss.circleTimer = 0.4; 
          }
      } 
      else if (boss.circlePhase === 'delay') {
          boss.circleTimer -= dt;
          if (boss.circleTimer <= 0) {
              boss.circlePhase = 'move';
              boss.circlePattern = Math.floor(Math.random() * 4);
              
              if (boss.circlePattern === 0) { boss.circleAngle = Math.PI; boss.circleCy = -300; boss.circleDir = -1; }
              else if (boss.circlePattern === 1) { boss.circleAngle = 0; boss.circleCy = -300; boss.circleDir = 1; }
              else if (boss.circlePattern === 2) { boss.circleAngle = Math.PI; boss.circleCy = H + 300; boss.circleDir = 1; }
              else { boss.circleAngle = Math.PI * 2; boss.circleCy = H + 300; boss.circleDir = -1; }
              
              boss.x = cx + Math.cos(boss.circleAngle) * rx;
              boss.y = boss.circleCy + Math.sin(boss.circleAngle) * ry;
          }
      }

      targetX = boss.x; targetY = boss.y;
      if (boss.state === 'entering') boss.enterTimer -= dt;
  }
  // ==========================================
  // ── Figure8 (黃金鯊：四角α型深淵迴旋) ──
  // ==========================================
  else if (pt === 'figure8' && boss.state !== 'dying') {
      let T = boss.figureTime;
      
      const editorAmp = Number(bd.sineAmp) || 25;
      const editorFreq = Number(bd.sineFreq) || 0.0008;

      if (boss.figurePhase === 'move') {
          const speedRatio = editorFreq / 0.0008; 
          const speedMult = (0.75 + Math.pow(Math.abs(T), 3) * 0.8) * speedRatio;
          boss.figureTime += 0.5 * speedMult * dt;
          T = boss.figureTime;

          if (T >= 1.25) {
              boss.figurePhase = 'delay';
              boss.figureTimer = 0.5;
          }

          const cx = W / 2;
          const cy = H / 2; 

          const dirX = (boss.figurePattern === 0 || boss.figurePattern === 2) ? 1 : -1;
          const dirY = (boss.figurePattern === 0 || boss.figurePattern === 1) ? 1 : -1;

          const sizeOffset = (editorAmp - 25) * 5; 
          
          const Rx = 400 + sizeOffset;   
          const Ry = 350 + sizeOffset;   
          const K = 700 + sizeOffset * 1.5;    
          const Vy = 750 + sizeOffset * 1.5;   

          const piT = Math.PI * T;

          boss.x = cx + dirX * (Rx * Math.cos(piT) - K * Math.pow(T, 4));
          boss.y = cy + dirY * (Vy * Math.pow(T, 3) - Ry * Math.sin(piT));

          const vx = dirX * (-Rx * Math.PI * Math.sin(piT) - 4 * K * Math.pow(T, 3));
          const vy = dirY * (3 * Vy * Math.pow(T, 2) - Ry * Math.PI * Math.cos(piT));

          boss.angle = Math.atan2(vy, vx);
      } 
      else if (boss.figurePhase === 'delay') {
          boss.figureTimer -= dt;
          boss.x = -9999; 
          boss.y = -9999;
          if (boss.figureTimer <= 0) {
              boss.figurePhase = 'move';
              boss.figureTime = -1.25; 
              boss.figurePattern = Math.floor(Math.random() * 4); 
          }
      }

      targetX = boss.x; targetY = boss.y;
      if (boss.state === 'entering') boss.enterTimer -= dt;
  }
  // ==========================================
  // 其他常規動態 (進退場兜底) 邏輯
  // ==========================================
  else {
      if(boss.state === 'entering'){
        boss.enterTimer -= dt;
        const t = easeInOut(1 - Math.max(0, boss.enterTimer / BOSS_ENTER_DURATION));
        const enterFrom = bd.enterFrom || 'left';
        if (enterFrom === 'right') {
          targetX = W + BOSS_DW/2 - (W/2 + BOSS_DW/2) * t;
        } else if (enterFrom === 'top') {
          targetX = W/2; boss.x = W/2; 
          targetY = -BOSS_DH/2 + (H/2 + BOSS_DH/2) * t;
        } else { 
          targetX = -BOSS_DW/2 + (W/2 + BOSS_DW/2) * t;
        }
        if (enterFrom !== 'top') targetY = H/2 + Math.sin(now * 0.0008) * 15;

      } else if(boss.state === 'active'){
        switch(pt) {
          case 'figure8':
            targetX = W/2 + Math.sin(now * freq) * amp * 2.5;
            targetY = H/2 + Math.sin(now * freq * 2) * amp;
            break;
          case 'circle':
            targetX = W/2 + Math.cos(now * freq) * amp * 2;
            targetY = H/2 + Math.sin(now * freq) * amp;
            break;
        }
      } else if(boss.state === 'dying'){
        boss.enterTimer -= dt;
        const t = easeInOut(1 - Math.max(0, boss.enterTimer / BOSS_EXIT_DURATION));
        const enterFrom = bd.enterFrom || 'left';
        if (enterFrom === 'right') targetX = W/2 - (W/2 + BOSS_DW/2) * t;
        else if (enterFrom === 'top') { targetX = W/2; targetY = H/2 - (H/2 + BOSS_DH/2) * t; }
        else targetX = W/2 + (W/2 + BOSS_DW/2) * t;
        
        if (enterFrom !== 'top') targetY = H/2 + Math.sin(now * 0.0008) * 15;
        if(boss.enterTimer <= 0){
          boss.state = 'dead'; hideBossUI();
          setTimeout(()=>{ boss.state = 'idle'; boss.hp = boss.maxHp; }, 500);
          return;
        }
      }
  }

  const lerpSpeed = 1 - Math.pow(0.01, dt);
  boss.x += (targetX - boss.x) * lerpSpeed;
  boss.y += (targetY - boss.y) * lerpSpeed;

  bossFrameTimer += dt; const bfd = 1/30;
  while(bossFrameTimer >= bfd){
    bossFrameTimer -= bfd; bossFrame = (bossFrame + 1) % (bd.frames || 1);
  }

  // ==========================================
  // ── 繪圖輸出 (含方向翻轉控制) ──
  // ==========================================
  const dw = bd.displayW || BOSS_DW;
  const dh = bd.displayH || BOSS_DH;

  ctx.save();
  ctx.translate(boss.x, boss.y);
  
  let scaleX = 1;
  if (boss.state !== 'dying' && boss.state !== 'dead') {
      if (pt === 'hover') {
          scaleX = boss.hoverDirection === 1 ? 1 : -1;
          ctx.scale(scaleX, 1);
      } else if (pt === 'sine') {
          scaleX = boss.sineDirection === 1 ? 1 : -1;
          ctx.scale(scaleX, 1);
      } else if (pt === 'straight') {
          scaleX = boss.straightDirection === 1 ? 1 : -1;
          ctx.scale(scaleX, 1);
      } else if (pt === 'circle') {
          scaleX = (boss.circlePattern === 0 || boss.circlePattern === 2) ? 1 : -1;
          ctx.scale(scaleX, 1);
      } else if (pt === 'figure8') {
          ctx.rotate(boss.angle);
          if (boss.figurePattern === 1 || boss.figurePattern === 3) {
              ctx.scale(1, -1);
          }
      }
  }

  if (bd.img) {
    const fc = bd.frames_cache ? bd.frames_cache[bossFrame] : null;
    if (bd.bgMode === 'black') ctx.globalCompositeOperation = 'screen';

    if (fc) {
      ctx.drawImage(fc, 0, 0, bd.frameW, bd.frameH, -dw/2, -dh/2, dw, dh);
      if(boss.hitFlash > 0){
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5;
        ctx.drawImage(fc, 0, 0, bd.frameW, bd.frameH, -dw/2, -dh/2, dw, dh);
        ctx.restore();
      }
    } else {
      const c = bd.cols || 1;
      const srcX = (bossFrame % c) * bd.frameW;
      const srcY = Math.floor(bossFrame / c) * bd.frameH;
      ctx.drawImage(bd.img, srcX, srcY, bd.frameW, bd.frameH, -dw/2, -dh/2, dw, dh);
      if(boss.hitFlash > 0){
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5;
        ctx.drawImage(bd.img, srcX, srcY, bd.frameW, bd.frameH, -dw/2, -dh/2, dw, dh);
        ctx.restore();
      }
    }
  } else {
    ctx.fillStyle = boss.hitFlash > 0 ? '#ff6600' : '#cc2200';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 30;
    ctx.fillRect(-dw/2, -dh/2, dw, dh);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
    
    if (scaleX === -1) ctx.scale(-1, 1); 
    if (pt === 'figure8') {
        if (boss.figurePattern === 1 || boss.figurePattern === 3) ctx.scale(1, -1); 
        ctx.rotate(-boss.angle); 
    }
    ctx.fillText('BOSS', 0, 10);
  }

  if (boss.hitFlash > 0) boss.hitFlash--;
  ctx.restore();
}
function checkBossCollision(){
  // ★ 修改：將判斷條件放寬，讓 Boss 在 'entering' (進場時) 也能被攻擊
  if(boss.state !== 'active' && boss.state !== 'entering') return;
  
  const bSize = _activeBossDef.size || 200; 
  for(let b of bullets){
    if(b.life <= 0) continue;
    if((Math.pow(b.x - boss.x, 2) / Math.pow(bSize * 1.8, 2)) + (Math.pow(b.y - boss.y, 2) / Math.pow(bSize * 1.0, 2)) < 1){
      b.life = 0; boss.hp = Math.max(0, boss.hp - betAmount); boss.hitFlash = 4; updateBossHpBar();
      
      comboCount++;
      comboTimer = 2.5; 
      updateComboUI();
      spawnParticles(b.x, b.y, '#ff4400', 10, 2, 7, 40);
      spawnFloatingText(b.x, b.y - 20, `-${betAmount}`, 35, '#ff6622', 14);
      if (b.type === 3) spawnRipple(b.x, b.y, 1.5);
      if(boss.hp <= 0){
        boss.state = 'dying'; boss.enterTimer = 2.5; bossTimerActive = false; if(_domCache.bossTimer) _domCache.bossTimer.classList.remove('show');
        for(let i=0; i<5; i++){ setTimeout(()=>{ spawnExplosion(boss.x+rand(-200,200), boss.y+rand(-150,150), rand(1.5,3.0)); spawnParticles(boss.x+rand(-200,200), boss.y+rand(-150,150),'#ffd700',20,3,10,60,true); }, i*300); }
        spawnFloatingText(boss.x, boss.y-100, 'BOSS 擊殺！限時獎勵 ×1.5', 120, '#ffee00', 30);
        
        spawnFlyingCoins(boss.x, boss.y, 100); 

        setTimeout(()=> settleBossResult(true), 800);
      }
      break;
    }
  }
}

// ════════════════════════════════════════════
//  核心繪製方法
// ════════════════════════════════════════════
const rand = (a,b) => a + Math.random()*(b-a);
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);

function drawFishGeom(f) {
  ctx.save(); ctx.translate(f.x, f.y);
  
  // 👇 ★ 核心修正：加入 0.15 的遲滯緩衝區，避免垂直震盪導致狂閃
  if (Math.cos(f.angle) < -0.15) f.isFacingLeft = true;
  else if (Math.cos(f.angle) > 0.15) f.isFacingLeft = false;
  const facingLeft = f.isFacingLeft; 
  
  ctx.rotate(f.angle + (facingLeft ? Math.PI : 0)); if(facingLeft) ctx.scale(-1, 1);
  const s = f.size, flash = f.hitFlash > 0;
  
  // 正常繪製幾何魚（包含陰影）
  ctx.shadowColor = flash ? '#ff0000' : f.glowColor; ctx.shadowBlur = isIOS ? 0 : (flash ? 20 : 8); ctx.globalAlpha = 1;
  ctx.fillStyle = f.color; ctx.beginPath(); ctx.ellipse(0, 0, s, s*0.52, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.72, 0); ctx.lineTo(-s*1.25, -s*0.48); ctx.lineTo(-s*1.25, s*0.48); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.1, -s*0.52); ctx.quadraticCurveTo(s*0.2, -s*0.9, s*0.4, -s*0.52); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(s*0.42, -s*0.1, s*0.13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s*0.44, -s*0.13, s*0.055, 0, Math.PI*2); ctx.fill();

  // ★ 修正：不再用方塊覆蓋，而是精準重繪魚的身體與尾巴，並填入半透明紅色
  if (flash) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)'; // 50% 紅色遮罩
    ctx.beginPath(); ctx.ellipse(0, 0, s, s*0.52, 0, 0, Math.PI*2); ctx.fill(); // 身體
    ctx.beginPath(); ctx.moveTo(-s*0.72, 0); ctx.lineTo(-s*1.25, -s*0.48); ctx.lineTo(-s*1.25, s*0.48); ctx.closePath(); ctx.fill(); // 尾巴
    ctx.beginPath(); ctx.moveTo(-s*0.1, -s*0.52); ctx.quadraticCurveTo(s*0.2, -s*0.9, s*0.4, -s*0.52); ctx.closePath(); ctx.fill(); // 魚鰭
  }
  ctx.restore();
}

function drawFishSprite(f, sprCfg) {
  const isReady = sprCfg.frames_cache || (sprCfg.img && sprCfg.img.complete);
  if (!isReady) return false;

  const dw = sprCfg.displayW || sprCfg.frameW;
  const dh = sprCfg.displayH || sprCfg.frameH;
  
  // 👇 ★ 核心修正：同步套用遲滯邏輯，這同時也修復了弧線魚旋轉過度時的翻肚 Bug
  if (Math.cos(f.angle) < -0.15) f.isFacingLeft = true;
  else if (Math.cos(f.angle) > 0.15) f.isFacingLeft = false;
  const isFacingLeft = f.isFacingLeft;

  ctx.save(); 
  ctx.translate(f.x, f.y); 
  ctx.rotate(f.angle);
  if (isFacingLeft) ctx.scale(1, -1);
  if (sprCfg.bgMode === 'black') ctx.globalCompositeOperation = 'screen';

  // 取得目前的圖片來源 (快取或原圖)
  const fc = sprCfg.frames_cache ? (sprCfg.frames_cache[f.frame] || sprCfg.frames_cache[0]) : null;

  // ── 1. 正常繪製 ──
  if (fc) {
    ctx.drawImage(fc, -dw / 2, -dh / 2, dw, dh);
  } else {
    const c = sprCfg.cols || 1;
    const srcX = (f.frame % c) * sprCfg.frameW;
    const srcY = Math.floor(f.frame / c) * sprCfg.frameH;
    ctx.drawImage(sprCfg.img, srcX, srcY, sprCfg.frameW, sprCfg.frameH, -dw / 2, -dh / 2, dw, dh);
  }

  // ── 2. ★ 極速效能版：高溫電漿受擊閃光 ──
  if (f.hitFlash > 0) {
    // 關鍵魔法：切換為加法混色，不需要計算陰影，直接讓原本的圖形產生過曝的白熱化發光感！
    ctx.globalCompositeOperation = 'lighter'; 
    ctx.globalAlpha = 0.55; 
    
    if (fc) {
      ctx.drawImage(fc, -dw / 2, -dh / 2, dw, dh);
    } else {
      const c = sprCfg.cols || 1;
      const srcX = (f.frame % c) * sprCfg.frameW;
      const srcY = Math.floor(f.frame / c) * sprCfg.frameH;
      ctx.drawImage(sprCfg.img, srcX, srcY, sprCfg.frameW, sprCfg.frameH, -dw / 2, -dh / 2, dw, dh);
    }
  }

  ctx.restore();
  return true;
}

function drawFish(f) {
  const cfg = f.sprCfg;
  let drawSuccess = false;
  
  // 1. 嘗試繪製 Sprite
  if (cfg && cfg.sheet) { 
    drawSuccess = drawFishSprite(f, cfg); 
  }
  
  // 2. 若無素材或載入中，則使用幾何繪製
  if (!drawSuccess) { 
    drawFishGeom(f); 
  }
}

// ★ 效能優化：totalW 是常數，提前算好，不在 spawnFish 裡每次重算
let _totalFishWeight = 0;
// （在資源載入後、遊戲開始前計算，見 startBtn handler）

function spawnFish(){
  const MAX_FISH = 999;
  if(fishes.length >= MAX_FISH) return;

  let r = Math.random() * _totalFishWeight;
  let baseType = FISH_TYPES[0];

  for (let t of FISH_TYPES) {
    const sprCfg = ASSETS.fishSprites[t.id] || {};
    const weight = (sprCfg.freq !== undefined) ? sprCfg.freq : t.freq;
    r -= weight;
    if (r <= 0) { baseType = t; break; }
  }

  const sprCfg = ASSETS.fishSprites[baseType.id] || {};
  
  // ★ 1. 讀取基礎數值與碰撞框
  const f_hp   = (sprCfg.hp)   ? sprCfg.hp   : baseType.hp;
  const f_mult = (sprCfg.mult) ? sprCfg.mult : baseType.mult;
  const f_size = (sprCfg.size) ? sprCfg.size : baseType.size;
  const f_speed = (sprCfg && sprCfg.speed) ? sprCfg.speed : baseType.speed;
  const f_hitType = (sprCfg.hitType) ? sprCfg.hitType : 'circle';
  const f_hitW    = (sprCfg.hitW)    ? sprCfg.hitW    : baseType.size * 2;
  const f_hitH    = (sprCfg.hitH)    ? sprCfg.hitH    : baseType.size * 1;

  // ★ 2. 讀取 Manager 的動態與陣型設定
  const formation = sprCfg.formation || 'single';
  const count = sprCfg.formationCount || 1;
  const pathType = sprCfg.pathType || 'straight';
  const sineAmp = sprCfg.sineAmp || 45;
  const sineFreq = sprCfg.sineFreq || 0.02;

  // ★ 3. 決定進場邊界與速度
  const spawnDir = sprCfg.spawnDir || 'all';
  let possibleSides = [0, 1, 2, 3]; // 0:上, 1:右, 2:下, 3:左
  
  if (spawnDir === 'horizontal') {
    possibleSides = [1, 3]; // 僅限左右
  } else if (spawnDir === 'vertical') {
    possibleSides = [0, 2]; // 僅限上下
  }
  
  const side = possibleSides[Math.floor(Math.random() * possibleSides.length)];
  const spd = f_speed * rand(0.85, 1.15);
  let startX, startY, vx, vy;

  if(side===0){ startX=rand(50,W-50); startY=-f_size-10; vx=rand(-0.4,0.4)*spd; vy=spd; }
  else if(side===1){ startX=W+f_size+10; startY=rand(80,H-80); vx=-spd; vy=rand(-0.3,0.3)*spd; }
  else if(side===2){ startX=rand(50,W-50); startY=H+f_size+10; vx=rand(-0.4,0.4)*spd; vy=-spd; }
  else { startX=-f_size-10; startY=rand(80,H-80); vx=spd; vy=rand(-0.3,0.3)*spd; }

  // ★ 動態計算陣型間距
  const fishLength = f_hitType === 'rect' ? f_hitW : f_size * 2.2;
  const spacing = fishLength * 1.15; 

  // ★ 關鍵修正：在迴圈「外面」先抽出一個共用的波浪相位
  const baseSinePhase = Math.random() * Math.PI * 2;

  // ★ 4. 根據陣型數量生成魚群
  for(let i=0; i<count; i++){
    let ox = 0, oy = 0;
    
    // 計算陣型偏移量
    if(formation === 'line'){
      ox = -vx * (spacing/spd) * i;
      oy = -vy * (spacing/spd) * i;
    } else if(formation === 'v_shape' && i > 0){
      const sideSign = (i%2===0) ? 1 : -1;
      const step = Math.ceil(i/2);
      const nx = -vy/spd, ny = vx/spd;
      const backDist = 0.6;   
      const sideSpread = 0.6; 
      ox = (-vx/spd * step * spacing * backDist) + (nx * sideSign * step * spacing * sideSpread);
      oy = (-vy/spd * step * spacing * backDist) + (ny * sideSign * step * spacing * sideSpread);
    } else if(formation === 'circle') {
      // ★ 拿掉 i > 0，讓 count 隻魚完美均分 360 度
      const angle = (Math.PI * 2 / count) * i; 
      // ★ 把半徑基數稍微調大一點(1.5)，讓圓圈更大氣，不會擠在一起
      const radius = spacing * Math.max(1.5, count / 4); 
      ox = Math.cos(angle) * radius;
      oy = Math.sin(angle) * radius;
    }
      
    // 產生魚隻實體 — ★ 優先從 fishPool 複用舊物件
    let fish = fishPool.length > 0 ? fishPool.pop() : {};
    const tMin = sprCfg.turnRateMin || 0.0005;
    const tMax = sprCfg.turnRateMax || 0.0015;
    Object.assign(fish, baseType, {
      x: startX + ox, y: startY + oy, vx, vy,
      hp: f_hp, maxHp: f_hp,
      mult: f_mult, size: f_size,
      hitType: f_hitType, hitW: f_hitW, hitH: f_hitH,
      angle: Math.atan2(vy, vx),
      
      // 👇 ★ 新增這行：記錄出生時的面對方向，作為後續的翻轉基準
      isFacingLeft: vx < 0, 
      
      // ★ 將數值降到 0.0005 ~ 0.0015 之間，創造如長弓般的優美大弧線
      arcAngle: Math.atan2(vy, vx), 
      turnRate: (pathType === 'arc') ? (Math.random() > 0.5 ? rand(tMin, tMax) : rand(-tMax, -tMin)) : 0,
      
      pathType: pathType,
      sinePhase: baseSinePhase,
      sineAmp: sineAmp,
      sineFreq: sineFreq,
      hitFlash: 0, dead: false,
      frame: 0, frameTimer: 0,
      sprCfg: sprCfg
    });
    fishes.push(fish);
  }
}

function fireBullet(tx, ty) {
  // 👇 ★ 修改：手動點擊開火時，計算當前指針角度，並交給核心發射函數
  if (drillWeapon.state === 'ready') {
      const angle = Math.atan2(ty - cannon.y, tx - cannon.x);
      launchDrill(angle);
      return; // 成功攔截，不發射一般子彈、不扣除金幣
  }
  
  if (coins < betAmount) return;
  coins -= betAmount; 
  stageTotalSpent += betAmount; // 👇 ★ 新增：每打一發子彈，就記錄進成本裡
  updateHUD();
  
  // ★ 動態後座力與專屬音效系統
  if (betAmount < 20) {
    recoilAmount = 12;       
    AudioEngine.play(SOUNDS.shoot1, 0.3); // 播放一階音效 (音量 30%)
  } else if (betAmount < 100) {
    recoilAmount = 24;       
    AudioEngine.play(SOUNDS.shoot2, 0.4); // 播放二階音效 (音量 40%)
  } else {
    recoilAmount = 36;       
    AudioEngine.play(SOUNDS.shoot3, 0.6); // 播放三階電漿音效 (威力最強，音量開到 60%!)
  }

  const angle = Math.atan2(ty - cannon.y, tx - cannon.x);
     
     // 讓子彈精準從砲管前端生成 (假設管長約 70px)
     const spawnX = cannon.x + Math.cos(angle) * 70;
     const spawnY = cannon.y + Math.sin(angle) * 70;
     
     if (betAmount < 20) {
       createBullet(spawnX, spawnY, angle, 12, 1);
     } else if (betAmount < 100) {
       const offsetX = Math.cos(angle + Math.PI/2) * 8;
       const offsetY = Math.sin(angle + Math.PI/2) * 8;
       createBullet(spawnX + offsetX, spawnY + offsetY, angle, 14, 2);
       createBullet(spawnX - offsetX, spawnY - offsetY, angle, 14, 2);
     } else {
       createBullet(spawnX, spawnY, angle, 16, 3);
     }
   }

// 抽取出來的子彈生成函式
function createBullet(x, y, angle, speed, type) {
  let b = bulletPool.length > 0 ? bulletPool.pop() : {}; // ★ 不再需要 trail 陣列！
  b.x = x; b.y = y;
  b.vx = Math.cos(angle) * speed; 
  b.vy = Math.sin(angle) * speed;
  b.life = 130;
  b.type = type; 
  bullets.push(b);
}

  let scale = Math.min(0.5 + (comboCount * 0.08), 2.2);

  let txtColor = '#990000';  
  let glowColor = '#550000';

    txtColor = '#ffffff'; 
    glowColor = '#ffcc00'; 
    if (_domCache.feverOverlay) _domCache.feverOverlay.classList.add('active'); // ★ 啟動狂熱金光
  }
  // 高溫階段 (50~99連擊)：亮黃色 + 橘色光暈
  else if (comboCount >= 50) { 
    txtColor = '#ffdd00'; 
    glowColor = '#ff6600'; 
    if (_domCache.feverOverlay) _domCache.feverOverlay.classList.remove('active'); // ★ 確保未達標時關閉
  }
  // 升溫階段 (20~49連擊)：橘紅色 + 鮮紅光暈 (原本是10)

  }
